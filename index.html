<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212B">
<title>학원 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── tokens ───────────────────────────────────────────────────────────── */
:root{
  --ink:#16212B; --ink-70:#4A5A68; --ink-40:#8A98A3;
  --paper:#F5F7F5; --card:#FFFFFF; --line:#E1E6E1; --line-2:#EEF1EE;
  --brand:#2E6B5E; --brand-soft:#E6F0EC; --brand-ink:#1F4C42;
  --warn:#B5482F; --warn-soft:#FAE9E4;
  --amber:#9C6A15; --amber-soft:#F9F0DC;
  --r:10px; --r-sm:6px;
  --sp:8px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── layout ───────────────────────────────────────────────────────────── */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{
  background:var(--ink); color:#fff; position:sticky; top:0; z-index:30;
  border-bottom:1px solid #0E1720;
}
.top .wrap{display:flex;align-items:center;gap:12px;height:52px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:-0.02em}
.brand small{font-family:var(--mono);font-size:10px;font-weight:500;color:#7E8F9B;letter-spacing:0.08em}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#B7C3CB}
.role-tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 7px;
  border-radius:4px;background:#26343F;color:#9FD2C4;border:1px solid #33454F;
}
.role-tag.master{background:var(--brand);color:#EAF6F1;border-color:#3B8272}
.btn-ghost-dark{color:#B7C3CB;font-size:12px;padding:5px 9px;border:1px solid #33454F;border-radius:var(--r-sm)}
.btn-ghost-dark:hover{background:#26343F;color:#fff}

nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:20}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{
  padding:11px 12px;font-size:13px;font-weight:600;color:var(--ink-40);
  border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.tab:hover{color:var(--ink-70)}
.tab.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
.tab .badge{
  font-family:var(--mono);font-size:10px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--warn);color:#fff;display:grid;place-items:center;
}
main{padding:20px 0 72px}

/* ── blocks ───────────────────────────────────────────────────────────── */
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-40);margin-bottom:6px;
}
h1.page{font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-bottom:2px}
.sub{font-size:12px;color:var(--ink-40)}
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card + .card{margin-top:12px}
.card-h{
  padding:11px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:13px;
}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px}
.card-b.tight{padding:0}

.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-40);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-0.02em;margin-top:4px}
.stat .v small{font-size:13px;color:var(--ink-40);font-weight:500}
.stat.alert{border-color:#E8C4B9;background:var(--warn-soft)}
.stat.alert .v{color:var(--warn)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-70);
}
.btn:hover{border-color:#CBD3CB;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.danger{color:var(--warn);border-color:#E8C4B9}
.btn.danger:hover{background:var(--warn-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* inputs */
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:11px;font-weight:700;color:var(--ink-70);margin-bottom:4px}
.in{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fff;outline:none;
}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.in.mono{font-family:var(--mono)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--ink-40);margin-top:4px}

/* table */
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-40);font-weight:500;background:#FAFBFA;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFA}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.t-scroll{overflow-x:auto}

/* pills */
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:20px;background:#F0F3F0;color:var(--ink-70);
}
.pill.ok{background:var(--brand-soft);color:var(--brand-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.mute{background:#F0F3F0;color:var(--ink-40)}

/* ── signature: 정원 게이지 (좌석 1개 = 눈금 1개) ─────────────────────── */
.seats{display:flex;gap:2px;align-items:center;margin-top:6px}
.seat{width:100%;max-width:9px;height:4px;border-radius:1px;background:#E4E9E4}
.seat.f{background:var(--brand)}
.seats.full .seat.f{background:var(--warn)}
.seat-txt{font-family:var(--mono);font-size:10px;color:var(--ink-40);margin-left:4px;white-space:nowrap}
.seats.full .seat-txt{color:var(--warn);font-weight:600}

/* ── timetable ────────────────────────────────────────────────────────── */
.tt{min-width:820px;border-collapse:separate;border-spacing:0}
.tt th,.tt td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.tt th:last-child,.tt td:last-child{border-right:0}
.tt th{padding:8px;text-align:center}
.tt td{padding:5px;vertical-align:top;height:64px;width:14%}
.tt td.slot{
  width:76px;background:#FAFBFA;text-align:center;vertical-align:middle;
  font-family:var(--mono);font-size:11px;color:var(--ink-70);
}
.cls{
  width:100%;text-align:left;padding:7px 8px;border-radius:var(--r-sm);
  background:var(--brand-soft);border:1px solid #CFE2DA;display:block;
}
.cls:hover{border-color:var(--brand)}
.cls.full{background:var(--warn-soft);border-color:#E8C4B9}
.cls .s{font-weight:700;font-size:12px;letter-spacing:-0.02em}
.cls .t{font-family:var(--mono);font-size:10px;color:var(--ink-40);margin-top:1px}

/* ── auth ─────────────────────────────────────────────────────────────── */
.auth-page{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.auth-box{width:100%;max-width:392px}
.auth-mark{margin-bottom:20px}
.auth-mark .t{font-size:24px;font-weight:800;letter-spacing:-0.04em}
.auth-mark .d{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-40);text-transform:uppercase;margin-top:4px}
.seg{display:flex;background:#EBEEEB;border-radius:var(--r-sm);padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:7px;font-size:12px;font-weight:700;border-radius:4px;color:var(--ink-40)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.msg{padding:9px 11px;border-radius:var(--r-sm);font-size:12px;margin-bottom:12px;line-height:1.45}
.msg.err{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--brand-soft);color:var(--brand-ink)}
.msg.info{background:#F0F3F0;color:var(--ink-70)}

/* ── modal ────────────────────────────────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(22,33,43,.44);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;font-weight:700}
.modal-h button{margin-left:auto;color:var(--ink-40);font-size:18px;line-height:1}
.modal-b{padding:16px}
.modal-f{padding:12px 16px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end}

/* ── toast ────────────────────────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{
  background:var(--ink);color:#fff;padding:9px 14px;border-radius:20px;font-size:12px;font-weight:600;
  box-shadow:0 6px 20px rgba(22,33,43,.24);max-width:88vw;
}
.toast.bad{background:var(--warn)}

/* ── mockup (사진) ────────────────────────────────────────────────────── */
.mock-note{
  border:1px dashed #C9D2C9;border-radius:var(--r);padding:14px;background:#FBFCFB;
  font-size:12px;color:var(--ink-70);line-height:1.6;
}
.mock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:12px}
.mock-tile{
  aspect-ratio:1;border-radius:var(--r-sm);border:1px solid var(--line);
  background:repeating-linear-gradient(45deg,#F2F4F2 0 8px,#EAEEEA 8px 16px);
  display:grid;place-items:center;
}
.mock-tile span{font-family:var(--mono);font-size:9px;color:var(--ink-40);letter-spacing:.08em}
.empty{padding:36px 16px;text-align:center;color:var(--ink-40);font-size:13px}
.empty b{display:block;color:var(--ink-70);font-size:14px;margin-bottom:4px}

.att-btns{display:flex;gap:4px;flex-wrap:wrap}
.ab{padding:4px 9px;border:1px solid var(--line);border-radius:20px;font-size:11px;font-weight:700;color:var(--ink-40)}
.ab.on-present{background:var(--brand);border-color:var(--brand);color:#fff}
.ab.on-late{background:var(--amber);border-color:var(--amber);color:#fff}
.ab.on-absent{background:var(--warn);border-color:var(--warn);color:#fff}
.ab.on-excused{background:var(--ink-70);border-color:var(--ink-70);color:#fff}

.print-head{display:none}
@media print{
  header.top,nav.tabs,.page-head .actions,.ov,#toast,.btn{display:none!important}
  body{background:#fff}
  .print-head{display:block;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
  .print-head .t{font-size:18px;font-weight:800}
  .print-head .d{font-family:var(--mono);font-size:10px;color:#555}
  .card{border-color:#999;break-inside:avoid}
  main{padding:0}
  .tt{min-width:0}
}
@media (max-width:640px){
  .top .who span.nm{display:none}
  main{padding:14px 0 60px}
  .wrap{padding:0 12px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ════════════════════════════════════════════════════════════════════════
   00. 설정  ★ 여기 3줄만 바꾸면 됩니다
   ════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL      = 'REPLACE_SUPABASE_URL';      // 예: https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = 'REPLACE_SUPABASE_ANON_KEY'; // Project Settings > API > anon public
const ACADEMY_NAME      = '○○ 학원';

/* ════════════════════════════════════════════════════════════════════════
   01. 상태
   ════════════════════════════════════════════════════════════════════════ */
let sb = null;                       // boot()에서 검증 후 생성
const DOW  = ['일','월','화','수','목','금','토'];
const DAYS = [1,2,3,4,5,6];
const ATT  = { present:'출석', late:'지각', absent:'결석', excused:'사유' };

const S = {
  screen:'boot', authTab:'in', msg:null,
  user:null, profile:null, tab:null, busy:false,
  students:[], classes:[], teachers:[], enrollments:[], profiles:[], links:[],
  attDate: todayStr(), attRows:{}, monthly:[], myAtt:[], sel:null
};

/* ════════════════════════════════════════════════════════════════════════
   02. 유틸
   ════════════════════════════════════════════════════════════════════════ */
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hm(t){ return t ? String(t).slice(0,5) : ''; }
function $(id){ return document.getElementById(id); }
function val(id){ const e=$(id); return e ? e.value.trim() : ''; }
function toast(m, bad=false){
  const el=document.createElement('div'); el.className='toast'+(bad?' bad':''); el.textContent=m;
  $('toast').appendChild(el); setTimeout(()=>el.remove(), bad?4200:2200);
}
function ageOf(b){ if(!b) return ''; const d=new Date(b), n=new Date();
  let a=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())) a--; return a+'세'; }
function seats(n, cap){
  const full = n>=cap, ticks=[];
  for(let i=0;i<cap;i++) ticks.push(`<i class="seat${i<n?' f':''}"></i>`);
  return `<div class="seats${full?' full':''}">${ticks.join('')}<span class="seat-txt">${n}/${cap}</span></div>`;
}
function activeCount(classId){ return S.enrollments.filter(e=>e.class_id===classId && !e.ended_on).length; }
function studentsOf(classId){
  const ids = S.enrollments.filter(e=>e.class_id===classId && !e.ended_on).map(e=>e.student_id);
  return S.students.filter(s=>ids.includes(s.id) && s.status==='active').sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
function teacherName(id){ const t=S.teachers.find(x=>x.id===id); return t?t.name:'—'; }

/* ════════════════════════════════════════════════════════════════════════
   03. 인증
   ════════════════════════════════════════════════════════════════════════ */
function cleanUrl(raw){
  let s = String(raw||'').trim().replace(/^["'`]|["'`]$/g,'').replace(/\/+$/,'');
  if(!s || /^REPLACE/i.test(s)) return { ok:false, why:'값이 아직 교체되지 않았습니다.' };
  if(/supabase\.com\/dashboard/i.test(s))
    return { ok:false, why:'대시보드 주소를 넣으셨습니다. Project Settings > API 의 Project URL 을 넣어야 합니다.' };
  if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try { new URL(s); } catch { return { ok:false, why:'URL 형식이 아닙니다.' }; }
  if(!/\.supabase\.(co|in)$/i.test(new URL(s).hostname))
    return { ok:true, url:s, warn:'형식이 일반적이지 않습니다. (예: https://abcdxyz.supabase.co)' };
  return { ok:true, url:s };
}

function cleanKey(raw){
  const s = String(raw||'').trim().replace(/^["'`]|["'`]$/g,'');
  if(!s || /^REPLACE/i.test(s)) return { ok:false, why:'값이 아직 교체되지 않았습니다.' };
  if(s.length < 40) return { ok:false, why:'키 길이가 너무 짧습니다. 일부만 복사된 것 같습니다.' };
  if(/service_role/i.test(s)) return { ok:false, why:'service_role 키는 사용할 수 없습니다. anon public 키를 넣으세요.' };
  return { ok:true, key:s };
}

async function boot(){
  const u = cleanUrl(SUPABASE_URL), k = cleanKey(SUPABASE_ANON_KEY);
  if(!u.ok || !k.ok){ S.cfg={u,k}; S.screen='config'; return render(); }
  try {
    sb = createClient(u.url, k.key);
  } catch(e){
    S.cfg={ u:{ok:false,why:'접속 객체 생성 실패 — '+e.message}, k }; S.screen='config'; return render();
  }
  const { data:{ session } } = await sb.auth.getSession();
  await applySession(session);
  sb.auth.onAuthStateChange((_e, s)=>{ applySession(s); });
}

async function applySession(session){
  if(!session){ S.user=null; S.profile=null; S.screen='auth'; return render(); }
  S.user = session.user;
  const { data, error } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if(error){ S.screen='auth'; S.msg={t:'err',m:'프로필 조회 실패 — '+error.message}; return render(); }
  if(!data){ S.screen='auth'; S.msg={t:'err',m:'프로필이 생성되지 않았습니다. v1.1 마이그레이션 실행 여부를 확인하세요.'}; return render(); }
  S.profile = data;
  if(data.status!=='approved'){ S.screen='pending'; return render(); }
  S.tab = data.role==='master' ? 'dash' : 'home';
  S.screen='app'; render();
  await loadData();
}

async function signIn(){
  S.msg=null; setBusy(true);
  const { error } = await sb.auth.signInWithPassword({ email: val('i_email'), password: val('i_pw') });
  setBusy(false);
  if(error) { S.msg={t:'err',m:'로그인 실패 — 이메일 또는 비밀번호를 확인하세요.'}; render(); }
}

async function signUp(){
  S.msg=null;
  const email=val('s_email'), pw=val('s_pw'), name=val('s_name'), phone=val('s_phone'), child=val('s_child');
  if(!email||!pw||!name||!child){ S.msg={t:'err',m:'이메일·비밀번호·보호자명·자녀 이름은 필수입니다.'}; return render(); }
  if(pw.length<8){ S.msg={t:'err',m:'비밀번호는 8자 이상으로 설정하세요.'}; return render(); }
  setBusy(true);
  const { data, error } = await sb.auth.signUp({
    email, password: pw, options:{ data:{ name, phone, student_name: child } }
  });
  setBusy(false);
  if(error){ S.msg={t:'err',m:'신청 실패 — '+error.message}; return render(); }
  if(!data.session){ S.authTab='in'; S.msg={t:'ok',m:'신청 완료. 메일의 인증 링크를 누른 뒤 로그인하면 승인 대기 상태가 됩니다.'}; return render(); }
}

async function signOut(){ await sb.auth.signOut(); S.tab=null; S.msg=null; }
function setBusy(b){ S.busy=b; render(); }

/* ════════════════════════════════════════════════════════════════════════
   04. 데이터 로드
   ════════════════════════════════════════════════════════════════════════ */
async function loadData(){
  try{
    if(S.profile.role==='master'){
      const [st,cl,te,en,pr,gs] = await Promise.all([
        sb.from('students').select('*').order('name'),
        sb.from('classes').select('*').eq('is_active',true).order('day_of_week').order('start_time'),
        sb.from('teachers').select('*').order('name'),
        sb.from('enrollments').select('*').is('ended_on',null),
        sb.from('profiles').select('*').order('created_at',{ascending:false}),
        sb.from('guardian_students').select('*')
      ]);
      const err=[st,cl,te,en,pr,gs].find(r=>r.error);
      if(err) throw err.error;
      S.students=st.data||[]; S.classes=cl.data||[]; S.teachers=te.data||[];
      S.enrollments=en.data||[]; S.profiles=pr.data||[]; S.links=gs.data||[];
    } else {
      const [st,en,cl,mo,at] = await Promise.all([
        sb.from('students').select('*'),
        sb.from('enrollments').select('*').is('ended_on',null),
        sb.from('classes').select('*'),
        sb.from('v_monthly_attendance').select('*'),
        sb.from('attendance').select('*').order('class_date',{ascending:false}).limit(60)
      ]);
      const err=[st,en,cl,mo,at].find(r=>r.error);
      if(err) throw err.error;
      S.students=st.data||[]; S.enrollments=en.data||[]; S.classes=cl.data||[];
      S.monthly=mo.data||[]; S.myAtt=at.data||[];
    }
  } catch(e){ toast('데이터 조회 실패 — '+e.message, true); }
  render();
}

async function loadAttendance(){
  const { data, error } = await sb.from('attendance').select('*').eq('class_date', S.attDate);
  if(error){ toast('출결 조회 실패 — '+error.message, true); return; }
  S.attRows={}; (data||[]).forEach(r=>{ S.attRows[r.class_id+'|'+r.student_id]=r; });
  render();
}

document.addEventListener('click', async (ev)=>{
  const t = ev.target.closest('[data-act]');
  if(!t) return;
  const a = t.dataset.act, id = t.dataset.id;

  if(a==='tab-in'){ S.authTab='in'; S.msg=null; return render(); }
  if(a==='tab-up'){ S.authTab='up'; S.msg=null; return render(); }
  if(a==='signin')  return signIn();
  if(a==='signup')  return signUp();
  if(a==='signout') return signOut();
  if(a==='go'){ S.tab=t.dataset.k; render(); if(S.tab==='att') loadAttendance(); return; }
  if(a==='print')   return window.print();
  if(a==='close' || (a==='ov' && ev.target.classList.contains('ov'))){ S.sel=null; return render(); }

  if(a==='cls-new'){ S.sel={kind:'cls',data:{}}; return render(); }
  if(a==='cls-edit'){ S.sel={kind:'cls',data:S.classes.find(c=>c.id===id)}; return render(); }
  if(a==='stu-new'){ S.sel={kind:'stu',data:{}}; return render(); }
  if(a==='stu-edit'){ S.sel={kind:'stu',data:S.students.find(s=>s.id===id)}; return render(); }
  if(a==='tea-new'){ S.sel={kind:'tea',data:{}}; return render(); }
  if(a==='tea-edit'){ S.sel={kind:'tea',data:S.teachers.find(x=>x.id===id)}; return render(); }
  if(a==='save')     return saveModal();
  if(a==='del')      return delModal();
  if(a==='withdraw') return withdraw();
  if(a==='enroll')   return enroll(id);
  if(a==='unenroll') return unenroll(id);
  if(a==='att-set')  return setAtt(t.dataset.c, t.dataset.s, t.dataset.v);
  if(a==='apr-ok')   return approve(id);
  if(a==='apr-no')   return setStatus(id,'rejected');
  if(a==='apr-revoke') return setStatus(id,'rejected');
  if(a==='apr-reopen') return setStatus(id,'pending');
});

document.addEventListener('change',(ev)=>{
  const t=ev.target.closest('[data-act="att-date"]');
  if(t){ S.attDate=t.value; loadAttendance(); }
});

async function saveModal(){
  const { kind, data } = S.sel;
  let q;
  if(kind==='cls'){
    const p={ subject:val('f_subject'), day_of_week:Number(val('f_dow')),
      start_time:val('f_st'), end_time:val('f_et'), max_capacity:Number(val('f_cap')),
      teacher_id:val('f_tea')||null, room:val('f_room')||null };
    if(!p.subject) return toast('수업명을 입력하세요.', true);
    if(p.end_time<=p.start_time) return toast('종료 시각이 시작 시각보다 빨라요.', true);
    q = data.id ? sb.from('classes').update(p).eq('id',data.id) : sb.from('classes').insert(p);
  }
  if(kind==='stu'){
    const p={ name:val('f_name'), birth_date:val('f_birth')||null,
      guardian_name:val('f_gname')||null, guardian_phone:val('f_gphone')||null,
      drive_folder_url:val('f_drive')||null, memo:val('f_memo')||null,
      consent_at: $('f_consent').checked ? (data.consent_at || new Date().toISOString()) : null };
    if(!p.name) return toast('이름을 입력하세요.', true);
    q = data.id ? sb.from('students').update(p).eq('id',data.id) : sb.from('students').insert(p);
  }
  if(kind==='tea'){
    const p={ name:val('f_name'), phone:val('f_phone')||null,
      subjects: val('f_subs') ? val('f_subs').split(',').map(x=>x.trim()).filter(Boolean) : [],
      hourly_rate: val('f_rate')?Number(val('f_rate')):null, is_active: $('f_active').checked };
    if(!p.name) return toast('이름을 입력하세요.', true);
    q = data.id ? sb.from('teachers').update(p).eq('id',data.id) : sb.from('teachers').insert(p);
  }
  const { error } = await q;
  if(error) return toast(error.message, true);
  S.sel=null; toast('저장했습니다.'); await loadData();
}

async function delModal(){
  const { kind, data } = S.sel;
  const tbl = kind==='cls' ? 'classes' : 'teachers';
  if(!confirm('삭제하면 연결된 기록도 함께 사라집니다. 계속할까요?')) return;
  const { error } = await sb.from(tbl).delete().eq('id', data.id);
  if(error) return toast(error.message, true);
  S.sel=null; toast('삭제했습니다.'); await loadData();
}

async function withdraw(){
  const d=S.sel.data;
  if(!confirm(`${d.name} 원아를 퇴원 처리할까요? 수강 중인 수업도 함께 종료됩니다.`)) return;
  const today=todayStr();
  const r1 = await sb.from('students').update({ status:'withdrawn', withdrawn_on:today }).eq('id',d.id);
  if(r1.error) return toast(r1.error.message, true);
  await sb.from('enrollments').update({ ended_on:today }).eq('student_id',d.id).is('ended_on',null);
  S.sel=null; toast('퇴원 처리했습니다.'); await loadData();
}

async function enroll(studentId){
  const classId=val('f_addcls');
  if(!classId) return toast('수업을 선택하세요.', true);
  const { error } = await sb.from('enrollments').insert({ student_id:studentId, class_id:classId });
  if(error){
    if(/정원 초과/.test(error.message)){
      if(confirm('정원이 찼습니다. 관리자 권한으로 강제 등록할까요?')){
        const r = await sb.rpc('force_enroll',{ p_student:studentId, p_class:classId });
        if(r.error) return toast(r.error.message, true);
        toast('강제 등록했습니다.');
        await loadData(); S.sel={kind:'stu',data:S.students.find(s=>s.id===studentId)}; return render();
      }
      return;
    }
    return toast(error.message, true);
  }
  toast('등록했습니다.');
  await loadData(); S.sel={kind:'stu',data:S.students.find(s=>s.id===studentId)}; render();
}

async function unenroll(enrollId){
  const e=S.enrollments.find(x=>x.id===enrollId); if(!e) return;
  const { error } = await sb.from('enrollments').update({ ended_on: todayStr() }).eq('id',enrollId);
  if(error) return toast(error.message, true);
  toast('해제했습니다.');
  await loadData(); S.sel={kind:'stu',data:S.students.find(s=>s.id===e.student_id)}; render();
}

async function setAtt(classId, studentId, status){
  const { error } = await sb.from('attendance')
    .upsert({ class_date:S.attDate, class_id:classId, student_id:studentId, status },
            { onConflict:'class_date,class_id,student_id' });
  if(error) return toast(error.message, true);
  await loadAttendance();
}

async function approve(guardianId){
  const sel=$('lk_'+guardianId), studentId=sel?sel.value:'';
  if(!studentId) return toast('연결할 원아를 선택하세요.', true);
  const r1 = await sb.from('guardian_students').insert({ guardian_id:guardianId, student_id:studentId });
  if(r1.error && !/duplicate/i.test(r1.error.message)) return toast(r1.error.message, true);
  const r2 = await sb.from('profiles')
    .update({ status:'approved', approved_at:new Date().toISOString(), approved_by:S.user.id })
    .eq('id',guardianId);
  if(r2.error) return toast(r2.error.message, true);
  toast('승인했습니다.'); await loadData();
}

async function setStatus(guardianId, status){
  const label={ rejected:'접근을 차단', pending:'대기 상태로 복원' }[status];
  if(!confirm(`이 계정을 ${label}할까요?`)) return;
  const { error } = await sb.from('profiles').update({ status }).eq('id',guardianId);
  if(error) return toast(error.message, true);
  if(status==='rejected') await sb.from('guardian_students').delete().eq('guardian_id',guardianId);
  toast('처리했습니다.'); await loadData();
}

/* ════════════════════════════════════════════════════════════════════════
   10. 전역 오류 표시 — 흰 화면 대신 원인을 화면에 띄웁니다
   ════════════════════════════════════════════════════════════════════════ */
function fatal(msg){
  const r=$('root'); if(!r) return;
  r.innerHTML = `<div class="auth-page"><div class="auth-box">
    <div class="auth-mark"><div class="t">실행 오류</div><div class="d">runtime error</div></div>
    <div class="card"><div class="card-b">
      <div class="msg err" style="word-break:break-all">${esc(msg)}</div>
      <div class="hint">이 메시지를 그대로 전달해 주세요. 새로고침(Ctrl+Shift+R) 후에도 같으면 설정값 문제입니다.</div>
    </div></div></div></div>`;
}
window.addEventListener('error', e => fatal(e.message||'알 수 없는 오류'));
window.addEventListener('unhandledrejection', e => fatal(String(e.reason?.message||e.reason||'')));

boot().catch(e => fatal(e.message||String(e)));
</script>
