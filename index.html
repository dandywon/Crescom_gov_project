<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRESCOM 정부과제 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e293b; --navy-2:#0f172a;
    --brand:#f97316; --brand-dark:#ea580c;
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0;
    --text:#111827; --text-sub:#475569; --text-muted:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;
    font-size:14px;background:#fff;color:var(--text);outline:none;font-family:inherit;transition:border .15s}
  textarea{resize:vertical;min-height:56px}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
  .btn{border:none;cursor:pointer;border-radius:8px;font-weight:600;font-family:inherit;
    font-size:14px;padding:10px 18px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-brand:hover{background:var(--brand-dark)}
  .btn-brand:disabled{opacity:.6;cursor:default}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text-sub)}
  .btn-ghost:hover{background:var(--bg)}
  .btn-sm{padding:6px 10px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .sidebar-item{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;
    gap:10px;font-size:13px;font-weight:500;color:#94a3b8;transition:all .15s}
  .sidebar-item:hover{background:rgba(255,255,255,.08);color:#e2e8f0}
  .sidebar-item.active{background:rgba(249,115,22,.15);color:var(--brand)}
  .sidebar-item i{font-size:17px}
  .grp-label{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;
    letter-spacing:.08em;padding:14px 12px 6px}
  .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--brand);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{padding:10px 14px;text-align:left;color:var(--text-sub);border-bottom:1px solid var(--border);
    font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#f9fafb;
    white-space:nowrap;cursor:pointer;user-select:none}
  .tbl th:hover{color:var(--brand)}
  .tbl td{padding:12px 14px;border-bottom:1px solid #f3f4f6;color:var(--text)}
  .tbl tr:hover td{background:#f9fafb}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
  .b-준비{background:#f1f5f9;color:#475569}
  .b-신청{background:#dbeafe;color:#1d4ed8}
  .b-수행{background:#dcfce7;color:#15803d}
  .b-완료{background:#e0e7ff;color:#4338ca}
  .b-탈락{background:#fee2e2;color:#b91c1c}
  .form-label{font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:5px;display:block}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;
    justify-content:center;z-index:1000;padding:30px 16px;overflow-y:auto}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;
    padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;
    box-shadow:0 6px 24px rgba(0,0,0,.25);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

/* ================= Supabase 연결 ================= */
const SUPABASE_URL = 'https://ykqqlayayoqjgrbmvwpy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F5DkAu39-jqdAOkmxy3HGg_CvV6_j71';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= 유틸 ================= */
const fmt = v => (Number(v)||0).toLocaleString('ko-KR');
const STATUS = ['준비','신청','수행','완료','탈락'];
const n = v => Number(String(v??'').replace(/,/g,''))||0;

/* 감사 로그 (조용히 기록, 실패해도 앱 진행) */
async function audit(user, action, recordId, detail){
  try{ await sb.from('audit_log').insert({
    user_email:user?.email||'', action, table_name:'projects',
    record_id:String(recordId||''), detail:detail||'' }); }catch(_){}
}

/* ================= 토스트 알림 ================= */
function useToast(){
  const [toast,setToast] = useState(null);
  const show = (msg,type='ok') => { setToast({msg,type}); setTimeout(()=>setToast(null),2600); };
  const node = toast ? (
    <div className="toast" style={{background:toast.type==='ok'?'#10b981':'#ef4444'}}>{toast.msg}</div>
  ) : null;
  return [node, show];
}

/* ================= 로그인 ================= */
function Login(){
  const [email,setEmail]=useState(''); const [pw,setPw]=useState('');
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  async function go(){
    if(!email.trim()||!pw){ setErr('이메일과 비밀번호를 입력하세요.'); return; }
    setBusy(true); setErr('');
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);
    if(error) setErr('로그인 실패: 이메일 또는 비밀번호를 확인하세요.');
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--navy)'}}>
      <div style={{width:360,padding:'36px 32px',background:'#fff',borderRadius:14,boxShadow:'0 10px 40px rgba(0,0,0,.3)'}}>
        <div style={{fontSize:22,fontWeight:800,color:'var(--brand)',letterSpacing:'-.02em'}}>CRESCOM</div>
        <div style={{fontSize:13,color:'var(--text-muted)',marginTop:2,marginBottom:24}}>정부과제 관리 시스템</div>
        <label className="form-label">이메일</label>
        <input style={{marginBottom:14}} value={email} onChange={e=>setEmail(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&go()} placeholder="you@crescom.co.kr"/>
        <label className="form-label">비밀번호</label>
        <input style={{marginBottom:20}} type="password" value={pw} onChange={e=>setPw(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&go()} placeholder="••••••••"/>
        <button className="btn btn-brand" style={{width:'100%',justifyContent:'center'}} onClick={go} disabled={busy}>
          {busy?'로그인 중...':'로그인'}
        </button>
        {err && <div style={{marginTop:14,fontSize:13,color:'#ef4444'}}>{err}</div>}
      </div>
    </div>
  );
}

/* ================= 사이드바 ================= */
function Sidebar({user,onLogout,tab,setTab}){
  return (
    <aside style={{width:220,background:'var(--navy)',display:'flex',flexDirection:'column',flexShrink:0,padding:'18px 12px'}}>
      <div style={{padding:'6px 8px 16px',borderBottom:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{fontSize:16,fontWeight:800,color:'var(--brand)',letterSpacing:'-.02em'}}>CRESCOM</div>
        <div style={{fontSize:10,color:'#64748b',marginTop:1}}>정부과제 관리</div>
      </div>
      <div className="grp-label">메인</div>
      <div className={"sidebar-item"+(tab==='dashboard'?' active':'')} onClick={()=>setTab('dashboard')}>
        <i className="ti ti-layout-dashboard"/> 전체 현황판
      </div>
      <div className="grp-label">공통 관리</div>
      <div className="sidebar-item" style={{opacity:.5,cursor:'default'}}>
        <i className="ti ti-users"/> 직원 관리 <span style={{fontSize:9,marginLeft:'auto'}}>준비중</span>
      </div>
      <div className="sidebar-item" style={{opacity:.5,cursor:'default'}}>
        <i className="ti ti-layout-grid"/> 참여율 현황 <span style={{fontSize:9,marginLeft:'auto'}}>준비중</span>
      </div>
      <div style={{marginTop:'auto',padding:'14px 8px 0',borderTop:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{fontSize:11,color:'#cbd5e1',marginBottom:8,wordBreak:'break-all'}}>{user.email}</div>
        <button className="btn btn-ghost" style={{width:'100%',fontSize:12,padding:'7px',justifyContent:'center'}} onClick={onLogout}>로그아웃</button>
      </div>
    </aside>
  );
}

/* ================= 과제 등록/수정 모달 ================= */
function ProjectModal({user,editItem,onClose,onSaved,showToast}){
  const isNew = !editItem;
  const [f,setF] = useState({
    project_code: editItem?.project_code||'',
    name:         editItem?.name||'',
    program:      editItem?.program||'',
    agency:       editItem?.agency||'',
    status:       editItem?.status||'준비',
    period_start: editItem?.period_start||'',
    period_end:   editItem?.period_end||'',
    govt_budget:  editItem?.govt_budget||'',
    cash_budget:  editItem?.cash_budget||'',
    kind_budget:  editItem?.kind_budget||'',
    manage_folder_url:   editItem?.manage_folder_url||'',
    evidence_folder_url: editItem?.evidence_folder_url||'',
    owner:        editItem?.owner||'',
    note:         editItem?.note||'',
  });
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const total = n(f.govt_budget)+n(f.cash_budget)+n(f.kind_budget);

  async function save(){
    if(!f.name.trim()){ setErr('사업명은 필수입니다.'); return; }
    setBusy(true); setErr('');
    const payload = {
      project_code:f.project_code.trim()||null,
      name:f.name.trim(), program:f.program.trim()||null, agency:f.agency.trim()||null,
      status:f.status,
      period_start:f.period_start||null, period_end:f.period_end||null,
      govt_budget:n(f.govt_budget), cash_budget:n(f.cash_budget), kind_budget:n(f.kind_budget),
      total_budget:total,
      manage_folder_url:f.manage_folder_url.trim()||null,
      evidence_folder_url:f.evidence_folder_url.trim()||null,
      owner:f.owner.trim()||null, note:f.note.trim()||null,
    };
    let res;
    if(isNew) res = await sb.from('projects').insert(payload).select().single();
    else{ payload.updated_at=new Date().toISOString();
          res = await sb.from('projects').update(payload).eq('id',editItem.id).select().single(); }
    setBusy(false);
    if(res.error){ setErr('저장 실패: '+res.error.message); return; }
    audit(user, isNew?'INSERT':'UPDATE', res.data.id, res.data.name);
    showToast(isNew?'과제가 등록되었습니다':'수정되었습니다');
    onSaved();
  }

  // 모달 안쪽 클릭/드래그가 바깥(닫힘)으로 전달되지 않도록 → 드래그 시 닫히는 문제 방지
  return (
    <div className="modal-bg" onMouseDown={onClose}>
      <div className="card" style={{width:'100%',maxWidth:720,padding:26}}
        onMouseDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div style={{fontSize:18,fontWeight:800}}>{isNew?'신규 과제 등록':'과제 수정'}</div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'var(--text-muted)'}}>×</button>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div><label className="form-label">사업명 * (지원사업명)</label>
            <input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="예: 2026 첨단 AI 지원사업"/></div>
          <div><label className="form-label">과제명 (선정된 과제 제목)</label>
            <input value={f.program} onChange={e=>set('program',e.target.value)} placeholder="예: 병원 주도형 AI 플랫폼"/></div>
          <div><label className="form-label">주관기관</label>
            <input value={f.agency} onChange={e=>set('agency',e.target.value)} placeholder="예: 한국의료기기안전정보원"/></div>
          <div><label className="form-label">과제 고유번호</label>
            <input value={f.project_code} onChange={e=>set('project_code',e.target.value)} placeholder="예: P-AX-2026"/></div>
          <div><label className="form-label">상태</label>
            <select value={f.status} onChange={e=>set('status',e.target.value)}>
              {STATUS.map(s=><option key={s} value={s}>{s}</option>)}
            </select></div>
          <div><label className="form-label">담당자</label>
            <input value={f.owner} onChange={e=>set('owner',e.target.value)} placeholder="담당자명"/></div>
          <div><label className="form-label">협약 시작일</label>
            <input type="date" value={f.period_start} onChange={e=>set('period_start',e.target.value)}/></div>
          <div><label className="form-label">협약 종료일</label>
            <input type="date" value={f.period_end} onChange={e=>set('period_end',e.target.value)}/></div>
          <div><label className="form-label">정부지원금</label>
            <input inputMode="numeric" value={f.govt_budget} onChange={e=>set('govt_budget',e.target.value)} placeholder="0"/></div>
          <div><label className="form-label">자부담 현금</label>
            <input inputMode="numeric" value={f.cash_budget} onChange={e=>set('cash_budget',e.target.value)} placeholder="0"/></div>
          <div><label className="form-label">자부담 현물</label>
            <input inputMode="numeric" value={f.kind_budget} onChange={e=>set('kind_budget',e.target.value)} placeholder="0"/></div>
          <div><label className="form-label">총사업비 (자동)</label>
            <div style={{padding:'9px 12px',background:'rgba(249,115,22,.08)',borderRadius:8,
              border:'1px solid rgba(249,115,22,.2)',fontWeight:800,color:'var(--brand)'}}>{fmt(total)}원</div></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">과제 관리 폴더 URL</label>
            <input value={f.manage_folder_url} onChange={e=>set('manage_folder_url',e.target.value)} placeholder="https://drive.google.com/drive/folders/..."/></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">증빙 폴더 URL</label>
            <input value={f.evidence_folder_url} onChange={e=>set('evidence_folder_url',e.target.value)} placeholder="https://drive.google.com/drive/folders/..."/></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">비고</label>
            <textarea value={f.note} onChange={e=>set('note',e.target.value)} rows={2} placeholder="특이사항"/></div>
        </div>

        {err && <div style={{marginTop:14,padding:'10px 14px',borderRadius:8,fontSize:13,
          background:'rgba(239,68,68,.1)',color:'#ef4444'}}>{err}</div>}

        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
          <button className="btn btn-ghost" onClick={onClose} disabled={busy}>취소</button>
          <button className="btn btn-brand" onClick={save} disabled={busy}>
            {busy?'저장 중...':(isNew?'등록':'저장')}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ================= 대시보드 ================= */
function Dashboard({user,showToast}){
  const [rows,setRows] = useState(null);
  const [err,setErr]   = useState('');
  const [modal,setModal] = useState(null); // null | 'new' | 과제객체
  const [sort,setSort] = useState({key:'created_at',dir:'desc'});

  async function load(){
    setErr('');
    const {data,error} = await sb.from('projects').select('*');
    if(error){ setErr(error.message); setRows([]); return; }
    setRows(data||[]);
  }
  useEffect(()=>{ load(); },[]);

  const sorted = useMemo(()=>{
    if(!rows) return [];
    const arr=[...rows]; const {key,dir}=sort; const m = dir==='asc'?1:-1;
    arr.sort((a,b)=>{
      let va=a[key], vb=b[key];
      if(['govt_budget','cash_budget','kind_budget','total_budget'].includes(key)){ va=n(va); vb=n(vb); }
      else { va=String(va??''); vb=String(vb??''); }
      if(va<vb) return -1*m; if(va>vb) return 1*m; return 0;
    });
    return arr;
  },[rows,sort]);

  const kpi = useMemo(()=>{
    const list=rows||[];
    return { count:list.length, active:list.filter(p=>p.status==='수행').length,
      budget:list.reduce((s,p)=>s+n(p.total_budget),0) };
  },[rows]);

  function toggleSort(key){ setSort(s=> s.key===key ? {key,dir:s.dir==='asc'?'desc':'asc'} : {key,dir:'asc'}); }
  const sortIcon = key => sort.key!==key ? '' : (sort.dir==='asc'?' ▲':' ▼');

  async function del(p){
    if(!confirm(`과제 "${p.name}"을(를) 삭제하시겠습니까?\n연결된 데이터(연차·비목·집행 등)도 함께 삭제됩니다.`)) return;
    const {error} = await sb.from('projects').delete().eq('id',p.id);
    if(error){ showToast('삭제 실패: '+error.message,'err'); return; }
    audit(user,'DELETE',p.id,p.name); showToast('삭제되었습니다'); load();
  }

  const Th = ({k,children,style}) => (<th onClick={()=>toggleSort(k)} style={style}>{children}{sortIcon(k)}</th>);

  return (
    <main style={{flex:1,padding:32,overflow:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,letterSpacing:'-.02em'}}>전체 현황판</h1>
          <div style={{fontSize:13,color:'var(--text-sub)',marginTop:4}}>{new Date().getFullYear()}년 정부과제 관리</div>
        </div>
        <button className="btn btn-brand" onClick={()=>setModal('new')}><i className="ti ti-plus"/> 신규 과제 등록</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:22}}>
        <div className="kpi"><div style={{fontSize:12,color:'var(--text-sub)',fontWeight:600,marginBottom:8}}>총 과제 수</div>
          <div style={{fontSize:26,fontWeight:800}}>{kpi.count}건</div></div>
        <div className="kpi"><div style={{fontSize:12,color:'var(--text-sub)',fontWeight:600,marginBottom:8}}>수행 중</div>
          <div style={{fontSize:26,fontWeight:800}}>{kpi.active}건</div></div>
        <div className="kpi"><div style={{fontSize:12,color:'var(--text-sub)',fontWeight:600,marginBottom:8}}>총 사업비</div>
          <div style={{fontSize:26,fontWeight:800}}>{fmt(kpi.budget)}<span style={{fontSize:15}}>원</span></div></div>
      </div>

      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)',fontSize:14,fontWeight:700,
          display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>과제 목록</span>
          <span style={{fontSize:11,color:'var(--text-muted)',fontWeight:400}}>제목·기관·상태 클릭 시 정렬</span>
        </div>

        {rows===null ? (
          <div style={{padding:40,display:'flex',justifyContent:'center'}}><div className="spinner"/></div>
        ) : err ? (
          <div style={{padding:30,color:'#ef4444',fontSize:13}}>연결 오류: {err}</div>
        ) : sorted.length===0 ? (
          <div style={{padding:'48px 24px',textAlign:'center'}}>
            <i className="ti ti-folder-open" style={{fontSize:40,color:'#cbd5e1'}}/>
            <div style={{fontWeight:700,marginTop:12}}>아직 등록된 과제가 없습니다</div>
            <div style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>우측 상단 "신규 과제 등록"으로 시작하세요.</div>
          </div>
        ) : (
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead><tr>
                <Th k="name">과제명</Th>
                <Th k="agency">주관기관</Th>
                <Th k="period_start">협약기간</Th>
                <Th k="total_budget" style={{textAlign:'right'}}>총사업비</Th>
                <Th k="status" style={{textAlign:'center'}}>상태</Th>
                <th style={{textAlign:'center'}}>폴더</th>
                <th style={{textAlign:'center'}}>관리</th>
              </tr></thead>
              <tbody>
                {sorted.map(p=>(
                  <tr key={p.id}>
                    <td>
                      <div style={{fontWeight:700}}>{p.name}</div>
                      {p.program && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{p.program}</div>}
                      {p.project_code && <span className="badge b-준비" style={{marginTop:4,fontSize:10}}>{p.project_code}</span>}
                    </td>
                    <td style={{fontSize:12,color:'var(--text-sub)'}}>{p.agency||'—'}</td>
                    <td style={{fontSize:12,color:'var(--text-sub)',whiteSpace:'nowrap'}}>
                      {p.period_start||'—'}<br/>~ {p.period_end||'—'}</td>
                    <td style={{textAlign:'right',fontWeight:700}}>{p.total_budget?fmt(p.total_budget)+'원':'—'}</td>
                    <td style={{textAlign:'center'}}><span className={"badge b-"+(p.status||'준비')}>{p.status||'준비'}</span></td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                      {p.evidence_folder_url ? <a href={p.evidence_folder_url} target="_blank" title="증빙 폴더"
                        style={{color:'var(--brand)',marginRight:8}}><i className="ti ti-folder"/></a> : null}
                      {p.manage_folder_url ? <a href={p.manage_folder_url} target="_blank" title="과제 관리 폴더"
                        style={{color:'#3b82f6'}}><i className="ti ti-folder-cog"/></a> : null}
                      {!p.evidence_folder_url && !p.manage_folder_url ? <span style={{color:'#cbd5e1'}}>—</span> : null}
                    </td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm" style={{marginRight:5}} onClick={()=>setModal(p)}><i className="ti ti-pencil"/></button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>del(p)} style={{color:'#ef4444'}}><i className="ti ti-trash"/></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <ProjectModal user={user}
          editItem={modal==='new'?null:modal}
          onClose={()=>setModal(null)}
          onSaved={()=>{ setModal(null); load(); }}
          showToast={showToast}/>
      )}
    </main>
  );
}

/* ================= 껍데기 ================= */
function Shell({user,onLogout}){
  const [tab,setTab] = useState('dashboard');
  const [toastNode,showToast] = useToast();
  return (
    <div style={{display:'flex',minHeight:'100vh'}}>
      <Sidebar user={user} onLogout={onLogout} tab={tab} setTab={setTab}/>
      {tab==='dashboard' && <Dashboard user={user} showToast={showToast}/>}
      {toastNode}
    </div>
  );
}

/* ================= 최상위 ================= */
function App(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setUser(data.session?.user||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setUser(s?.user||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(user===undefined) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;
  if(!user) return <Login/>;
  return <Shell user={user} onLogout={async()=>{await sb.auth.signOut();}}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
