<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRESCOM 정부과제 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e293b; --navy-2:#0f172a;
    --brand:#f97316; --brand-dark:#ea580c;
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0;
    --text:#111827; --text-sub:#475569; --text-muted:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;
    font-size:14px;background:#fff;color:var(--text);outline:none;font-family:inherit;transition:border .15s}
  textarea{resize:vertical;min-height:56px}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
  .btn{border:none;cursor:pointer;border-radius:8px;font-weight:600;font-family:inherit;
    font-size:14px;padding:10px 18px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-brand:hover{background:var(--brand-dark)}
  .btn-brand:disabled{opacity:.6;cursor:default}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text-sub)}
  .btn-ghost:hover{background:var(--bg)}
  .btn-sm{padding:6px 10px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .sidebar-item{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;
    gap:10px;font-size:13px;font-weight:500;color:#94a3b8;transition:all .15s}
  .sidebar-item:hover{background:rgba(255,255,255,.08);color:#e2e8f0}
  .sidebar-item.active{background:rgba(249,115,22,.15);color:var(--brand)}
  .sidebar-item i{font-size:17px}
  .grp-label{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;
    letter-spacing:.08em;padding:14px 12px 6px}
  .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--brand);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{padding:10px 14px;text-align:left;color:var(--text-sub);border-bottom:1px solid var(--border);
    font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#f9fafb;
    white-space:nowrap;cursor:pointer;user-select:none}
  .tbl th:hover{color:var(--brand)}
  .tbl td{padding:12px 14px;border-bottom:1px solid #f3f4f6;color:var(--text)}
  .tbl tr:hover td{background:#f9fafb}
  .row-click{cursor:pointer}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
  .b-준비{background:#f1f5f9;color:#475569}
  .b-신청{background:#dbeafe;color:#1d4ed8}
  .b-수행{background:#dcfce7;color:#15803d}
  .b-완료{background:#e0e7ff;color:#4338ca}
  .b-탈락{background:#fee2e2;color:#b91c1c}
  .form-label{font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:5px;display:block}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;
    justify-content:center;z-index:1000;padding:30px 16px;overflow-y:auto}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;
    padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;
    box-shadow:0 6px 24px rgba(0,0,0,.25);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  .ptab{padding:12px 4px;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;
    border-bottom:2px solid transparent;margin-right:26px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .ptab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .ptab:hover{color:var(--text-sub)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

/* ================= Supabase 연결 ================= */
const SUPABASE_URL = 'https://ykqqlayayoqjgrbmvwpy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F5DkAu39-jqdAOkmxy3HGg_CvV6_j71';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= 유틸 ================= */
const fmt = v => (Number(v)||0).toLocaleString('ko-KR');
const STATUS = ['준비','신청','수행','완료','탈락'];
const n = v => Number(String(v??'').replace(/,/g,''))||0;

async function audit(user, action, recordId, detail){
  try{ await sb.from('audit_log').insert({
    user_email:user?.email||'', action, table_name:'projects',
    record_id:String(recordId||''), detail:detail||'' }); }catch(_){}
}

function useToast(){
  const [toast,setToast] = useState(null);
  const show = (msg,type='ok') => { setToast({msg,type}); setTimeout(()=>setToast(null),2600); };
  const node = toast ? (
    <div className="toast" style={{background:toast.type==='ok'?'#10b981':'#ef4444'}}>{toast.msg}</div>
  ) : null;
  return [node, show];
}

/* ================= 로그인 ================= */
function Login(){
  const [email,setEmail]=useState(''); const [pw,setPw]=useState('');
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  async function go(){
    if(!email.trim()||!pw){ setErr('이메일과 비밀번호를 입력하세요.'); return; }
    setBusy(true); setErr('');
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);
    if(error) setErr('로그인 실패: 이메일 또는 비밀번호를 확인하세요.');
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--navy)'}}>
      <div style={{width:360,padding:'36px 32px',background:'#fff',borderRadius:14,boxShadow:'0 10px 40px rgba(0,0,0,.3)'}}>
        <div style={{fontSize:22,fontWeight:800,color:'var(--brand)',letterSpacing:'-.02em'}}>CRESCOM</div>
        <div style={{fontSize:13,color:'var(--text-muted)',marginTop:2,marginBottom:24}}>정부과제 관리 시스템</div>
        <label className="form-label">이메일</label>
        <input style={{marginBottom:14}} value={email} onChange={e=>setEmail(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&go()} placeholder="you@crescom.co.kr"/>
        <label className="form-label">비밀번호</label>
        <input style={{marginBottom:20}} type="password" value={pw} onChange={e=>setPw(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&go()} placeholder="••••••••"/>
        <button className="btn btn-brand" style={{width:'100%',justifyContent:'center'}} onClick={go} disabled={busy}>
          {busy?'로그인 중...':'로그인'}
        </button>
        {err && <div style={{marginTop:14,fontSize:13,color:'#ef4444'}}>{err}</div>}
      </div>
    </div>
  );
}

/* ================= 사이드바 ================= */
function Sidebar({user,onLogout,tab,setTab}){
  return (
    <aside style={{width:220,background:'var(--navy)',display:'flex',flexDirection:'column',flexShrink:0,padding:'18px 12px'}}>
      <div style={{padding:'6px 8px 16px',borderBottom:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{fontSize:16,fontWeight:800,color:'var(--brand)',letterSpacing:'-.02em'}}>CRESCOM</div>
        <div style={{fontSize:10,color:'#64748b',marginTop:1}}>정부과제 관리</div>
      </div>
      <div className="grp-label">메인</div>
      <div className={"sidebar-item"+(tab==='dashboard'?' active':'')} onClick={()=>setTab('dashboard')}>
        <i className="ti ti-layout-dashboard"/> 전체 현황판
      </div>
      <div className="grp-label">공통 관리</div>
      <div className="sidebar-item" style={{opacity:.5,cursor:'default'}}>
        <i className="ti ti-users"/> 직원 관리 <span style={{fontSize:9,marginLeft:'auto'}}>준비중</span>
      </div>
      <div className="sidebar-item" style={{opacity:.5,cursor:'default'}}>
        <i className="ti ti-layout-grid"/> 참여율 현황 <span style={{fontSize:9,marginLeft:'auto'}}>준비중</span>
      </div>
      <div style={{marginTop:'auto',padding:'14px 8px 0',borderTop:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{fontSize:11,color:'#cbd5e1',marginBottom:8,wordBreak:'break-all'}}>{user.email}</div>
        <button className="btn btn-ghost" style={{width:'100%',fontSize:12,padding:'7px',justifyContent:'center'}} onClick={onLogout}>로그아웃</button>
      </div>
    </aside>
  );
}

/* ================= 과제 등록/수정 모달 ================= */
function ProjectModal({user,editItem,onClose,onSaved,showToast}){
  const isNew = !editItem;
  const [f,setF] = useState({
    project_code: editItem?.project_code||'', name: editItem?.name||'',
    program: editItem?.program||'', agency: editItem?.agency||'',
    status: editItem?.status||'준비',
    period_start: editItem?.period_start||'', period_end: editItem?.period_end||'',
    govt_budget: editItem?.govt_budget||'', cash_budget: editItem?.cash_budget||'',
    kind_budget: editItem?.kind_budget||'',
    manage_folder_url: editItem?.manage_folder_url||'', evidence_folder_url: editItem?.evidence_folder_url||'',
    owner: editItem?.owner||'', note: editItem?.note||'',
  });
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const total = n(f.govt_budget)+n(f.cash_budget)+n(f.kind_budget);

  async function save(){
    if(!f.name.trim()){ setErr('사업명은 필수입니다.'); return; }
    setBusy(true); setErr('');
    const payload = {
      project_code:f.project_code.trim()||null, name:f.name.trim(),
      program:f.program.trim()||null, agency:f.agency.trim()||null, status:f.status,
      period_start:f.period_start||null, period_end:f.period_end||null,
      govt_budget:n(f.govt_budget), cash_budget:n(f.cash_budget), kind_budget:n(f.kind_budget),
      total_budget:total, manage_folder_url:f.manage_folder_url.trim()||null,
      evidence_folder_url:f.evidence_folder_url.trim()||null,
      owner:f.owner.trim()||null, note:f.note.trim()||null,
    };
    let res;
    if(isNew) res = await sb.from('projects').insert(payload).select().single();
    else{ payload.updated_at=new Date().toISOString();
          res = await sb.from('projects').update(payload).eq('id',editItem.id).select().single(); }
    setBusy(false);
    if(res.error){ setErr('저장 실패: '+res.error.message); return; }
    audit(user, isNew?'INSERT':'UPDATE', res.data.id, res.data.name);
    showToast(isNew?'과제가 등록되었습니다':'수정되었습니다');
    onSaved(res.data);
  }

  return (
    <div className="modal-bg" onMouseDown={onClose}>
      <div className="card" style={{width:'100%',maxWidth:720,padding:26}}
        onMouseDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div style={{fontSize:18,fontWeight:800}}>{isNew?'신규 과제 등록':'과제 수정'}</div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'var(--text-muted)'}}>×</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div><label className="form-label">사업명 * (지원사업명)</label>
            <input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="예: 2026 첨단 AI 지원사업"/></div>
          <div><label className="form-label">과제명 (선정된 과제 제목)</label>
            <input value={f.program} onChange={e=>set('program',e.target.value)} placeholder="예: 병원 주도형 AI 플랫폼"/></div>
          <div><label className="form-label">주관기관</label>
            <input value={f.agency} onChange={e=>set('agency',e.target.value)} placeholder="예: 한국의료기기안전정보원"/></div>
          <div><label className="form-label">과제 고유번호</label>
            <input value={f.project_code} onChange={e=>set('project_code',e.target.value)} placeholder="예: P-AX-2026"/></div>
          <div><label className="form-label">상태</label>
            <select value={f.status} onChange={e=>set('status',e.target.value)}>
              {STATUS.map(s=><option key={s} value={s}>{s}</option>)}
            </select></div>
          <div><label className="form-label">담당자</label>
            <input value={f.owner} onChange={e=>set('owner',e.target.value)} placeholder="담당자명"/></div>
          <div><label className="form-label">협약 시작일</label>
            <input type="date" value={f.period_start} onChange={e=>set('period_start',e.target.value)}/></div>
          <div><label className="form-label">협약 종료일</label>
            <input type="date" value={f.period_end} onChange={e=>set('period_end',e.target.value)}/></div>
          <div><label className="form-label">정부지원금</label>
            <MoneyInput value={f.govt_budget} onChange={v=>set('govt_budget',v)} placeholder="0"/></div>
          <div><label className="form-label">자부담 현금</label>
            <MoneyInput value={f.cash_budget} onChange={v=>set('cash_budget',v)} placeholder="0"/></div>
          <div><label className="form-label">자부담 현물</label>
            <MoneyInput value={f.kind_budget} onChange={v=>set('kind_budget',v)} placeholder="0"/></div>
          <div><label className="form-label">총사업비 (자동)</label>
            <div style={{padding:'9px 12px',background:'rgba(249,115,22,.08)',borderRadius:8,
              border:'1px solid rgba(249,115,22,.2)',fontWeight:800,color:'var(--brand)'}}>{fmt(total)}원</div></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">과제 관리 폴더 URL</label>
            <input value={f.manage_folder_url} onChange={e=>set('manage_folder_url',e.target.value)} placeholder="https://drive.google.com/drive/folders/..."/></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">증빙 폴더 URL</label>
            <input value={f.evidence_folder_url} onChange={e=>set('evidence_folder_url',e.target.value)} placeholder="https://drive.google.com/drive/folders/..."/></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">비고</label>
            <textarea value={f.note} onChange={e=>set('note',e.target.value)} rows={2} placeholder="특이사항"/></div>
        </div>
        {err && <div style={{marginTop:14,padding:'10px 14px',borderRadius:8,fontSize:13,
          background:'rgba(239,68,68,.1)',color:'#ef4444'}}>{err}</div>}
        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
          <button className="btn btn-ghost" onClick={onClose} disabled={busy}>취소</button>
          <button className="btn btn-brand" onClick={save} disabled={busy}>
            {busy?'저장 중...':(isNew?'등록':'저장')}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ================= 대시보드 ================= */
function Dashboard({user,showToast,onOpen}){
  const [rows,setRows] = useState(null);
  const [err,setErr]   = useState('');
  const [modal,setModal] = useState(null);
  const [sort,setSort] = useState({key:'created_at',dir:'desc'});

  async function load(){
    setErr('');
    const {data,error} = await sb.from('projects').select('*');
    if(error){ setErr(error.message); setRows([]); return; }
    setRows(data||[]);
  }
  useEffect(()=>{ load(); },[]);

  const sorted = useMemo(()=>{
    if(!rows) return [];
    const arr=[...rows]; const {key,dir}=sort; const m = dir==='asc'?1:-1;
    arr.sort((a,b)=>{
      let va=a[key], vb=b[key];
      if(['govt_budget','cash_budget','kind_budget','total_budget'].includes(key)){ va=n(va); vb=n(vb); }
      else { va=String(va??''); vb=String(vb??''); }
      if(va<vb) return -1*m; if(va>vb) return 1*m; return 0;
    });
    return arr;
  },[rows,sort]);

  const kpi = useMemo(()=>{
    const list=rows||[];
    return { count:list.length, active:list.filter(p=>p.status==='수행').length,
      budget:list.reduce((s,p)=>s+n(p.total_budget),0) };
  },[rows]);

  function toggleSort(key){ setSort(s=> s.key===key ? {key,dir:s.dir==='asc'?'desc':'asc'} : {key,dir:'asc'}); }
  const sortIcon = key => sort.key!==key ? '' : (sort.dir==='asc'?' ▲':' ▼');

  async function del(p){
    if(!confirm(`과제 "${p.name}"을(를) 삭제하시겠습니까?\n연결된 데이터(연차·비목·집행 등)도 함께 삭제됩니다.`)) return;
    const {error} = await sb.from('projects').delete().eq('id',p.id);
    if(error){ showToast('삭제 실패: '+error.message,'err'); return; }
    audit(user,'DELETE',p.id,p.name); showToast('삭제되었습니다'); load();
  }

  const Th = ({k,children,style}) => (<th onClick={()=>toggleSort(k)} style={style}>{children}{sortIcon(k)}</th>);

  return (
    <main style={{flex:1,padding:32,overflow:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,letterSpacing:'-.02em'}}>전체 현황판</h1>
          <div style={{fontSize:13,color:'var(--text-sub)',marginTop:4}}>{new Date().getFullYear()}년 정부과제 관리</div>
        </div>
        <button className="btn btn-brand" onClick={()=>setModal('new')}><i className="ti ti-plus"/> 신규 과제 등록</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:22}}>
        <div className="kpi"><div style={{fontSize:12,color:'var(--text-sub)',fontWeight:600,marginBottom:8}}>총 과제 수</div>
          <div style={{fontSize:26,fontWeight:800}}>{kpi.count}건</div></div>
        <div className="kpi"><div style={{fontSize:12,color:'var(--text-sub)',fontWeight:600,marginBottom:8}}>수행 중</div>
          <div style={{fontSize:26,fontWeight:800}}>{kpi.active}건</div></div>
        <div className="kpi"><div style={{fontSize:12,color:'var(--text-sub)',fontWeight:600,marginBottom:8}}>총 사업비</div>
          <div style={{fontSize:26,fontWeight:800}}>{fmt(kpi.budget)}<span style={{fontSize:15}}>원</span></div></div>
      </div>

      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)',fontSize:14,fontWeight:700,
          display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>과제 목록</span>
          <span style={{fontSize:11,color:'var(--text-muted)',fontWeight:400}}>과제명 클릭 시 상세 · 컬럼 클릭 시 정렬</span>
        </div>

        {rows===null ? (
          <div style={{padding:40,display:'flex',justifyContent:'center'}}><div className="spinner"/></div>
        ) : err ? (
          <div style={{padding:30,color:'#ef4444',fontSize:13}}>연결 오류: {err}</div>
        ) : sorted.length===0 ? (
          <div style={{padding:'48px 24px',textAlign:'center'}}>
            <i className="ti ti-folder-open" style={{fontSize:40,color:'#cbd5e1'}}/>
            <div style={{fontWeight:700,marginTop:12}}>아직 등록된 과제가 없습니다</div>
            <div style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>우측 상단 "신규 과제 등록"으로 시작하세요.</div>
          </div>

                      {p.project_code && <span className="badge b-준비" style={{marginTop:4,marginLeft:19,fontSize:10}}>{p.project_code}</span>}
                    </td>
                    <td style={{fontSize:12,color:'var(--text-sub)'}}>{p.agency||'—'}</td>

                    <td style={{textAlign:'right',fontWeight:700}}>{p.total_budget?fmt(p.total_budget)+'원':'—'}</td>
                    <td style={{textAlign:'center'}}><span className={"badge b-"+(p.status||'준비')}>{p.status||'준비'}</span></td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                      {p.evidence_folder_url ? <a href={p.evidence_folder_url} target="_blank" title="증빙 폴더"
                        style={{color:'var(--brand)',marginRight:8}}><i className="ti ti-folder"/></a> : null}
                      {p.manage_folder_url ? <a href={p.manage_folder_url} target="_blank" title="과제 관리 폴더"
                        style={{color:'#3b82f6'}}><i className="ti ti-folder-cog"/></a> : null}
                      {!p.evidence_folder_url && !p.manage_folder_url ? <span style={{color:'#cbd5e1'}}>—</span> : null}
                    </td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm" style={{marginRight:5}} onClick={()=>setModal(p)}><i className="ti ti-pencil"/></button>

                ))}

            </table>
          </div>
        )}
      </div>

      {modal && (
        <ProjectModal user={user} editItem={modal==='new'?null:modal}
          onClose={()=>setModal(null)} onSaved={()=>{ setModal(null); load(); }} showToast={showToast}/>
      )}
    </main>
  );
}

/* ================= 연차 수정/추가 모달 ================= */
function YearModal({year,onClose,onSave}){
  const isNew = !year;
  const [f,setF] = useState({
    year_label: year?.year_label||'',
    start_date: year?.start_date||'',
    end_date:   year?.end_date||'',
    govt_budget: year?.govt_budget||'',
    cash_budget: year?.cash_budget||'',
    kind_budget: year?.kind_budget||'',
    carry_over:  year?.carry_over||'',
    note:        year?.note||'',
  });
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const total = n(f.govt_budget)+n(f.cash_budget)+n(f.kind_budget);

  async function go(){
    if(!f.year_label.trim()){ setErr('연차명을 입력하세요.'); return; }
    setBusy(true); setErr('');
    await onSave({
      year_label:f.year_label.trim(),
      start_date:f.start_date||null, end_date:f.end_date||null,
      govt_budget:n(f.govt_budget), cash_budget:n(f.cash_budget), kind_budget:n(f.kind_budget),
      total_budget:total, carry_over:n(f.carry_over), note:f.note.trim()||null,
    });
    setBusy(false);
  }

  return (
    <div className="modal-bg" onMouseDown={onClose}>
      <div className="card" style={{width:'100%',maxWidth:560,padding:24}}
        onMouseDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <div style={{fontSize:17,fontWeight:800}}>{isNew?'연차 추가':'연차 수정'}</div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'var(--text-muted)'}}>×</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13}}>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">연차명</label>
            <input value={f.year_label} onChange={e=>set('year_label',e.target.value)} placeholder="예: 1차년도"/></div>
          <div><label className="form-label">시작일</label>
            <input type="date" value={f.start_date} onChange={e=>set('start_date',e.target.value)}/></div>
          <div><label className="form-label">종료일</label>
            <input type="date" value={f.end_date} onChange={e=>set('end_date',e.target.value)}/></div>
          <div><label className="form-label">정부출연금</label>
            <MoneyInput value={f.govt_budget} onChange={v=>set('govt_budget',v)} placeholder="0"/></div>
          <div><label className="form-label">자부담 현금</label>
            <MoneyInput value={f.cash_budget} onChange={v=>set('cash_budget',v)} placeholder="0"/></div>
          <div><label className="form-label">자부담 현물</label>
            <MoneyInput value={f.kind_budget} onChange={v=>set('kind_budget',v)} placeholder="0"/></div>
          <div><label className="form-label">예산합계 (자동)</label>
            <div style={{padding:'9px 12px',background:'rgba(249,115,22,.08)',borderRadius:8,
              border:'1px solid rgba(249,115,22,.2)',fontWeight:800,color:'var(--brand)'}}>{fmt(total)}원</div></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">이월금</label>
            <MoneyInput value={f.carry_over} onChange={v=>set('carry_over',v)} placeholder="전 연차에서 이월된 금액 (없으면 0)"/></div>
          <div style={{gridColumn:'1 / span 2'}}><label className="form-label">비고</label>
            <textarea value={f.note} onChange={e=>set('note',e.target.value)} rows={2} placeholder="특이사항"/></div>
        </div>
        {err && <div style={{marginTop:14,padding:'10px 14px',borderRadius:8,fontSize:13,background:'rgba(239,68,68,.1)',color:'#ef4444'}}>{err}</div>}
        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:18}}>
          <button className="btn btn-ghost" onClick={onClose} disabled={busy}>취소</button>
          <button className="btn btn-brand" onClick={go} disabled={busy}>{busy?'저장 중...':'저장'}</button>
        </div>
      </div>
    </div>
  );
}

/* ================= 연차 관리 (등록·설정 탭 내용 1) ================= */
function YearManager({user,proj,showToast}){
  const [rows,setRows] = useState(null);
  const [modal,setModal] = useState(null); // null | 'new' | 연차객체

  async function load(){
    const {data} = await sb.from('project_years').select('*').eq('project_id',proj.id);
    const arr = (data||[]).sort((a,b)=>(a.year_no||0)-(b.year_no||0)
      || String(a.start_date||'').localeCompare(String(b.start_date||'')));
    setRows(arr);
  }
  useEffect(()=>{ load(); },[proj.id]);

  // 협약기간 기준 12개월 단위 연차 계산
  function genYears(){
    const s = proj.period_start, e = proj.period_end;
    if(!s||!e){ showToast('먼저 협약 시작일/종료일을 입력하세요','err'); return null; }
    const iso = d => d.toISOString().slice(0,10);
    const sd=new Date(s), ed=new Date(e);
    if(sd>ed){ showToast('협약 종료일이 시작일보다 빠릅니다','err'); return null; }
    const out=[]; let cur=new Date(sd); let no=1;
    while(cur<=ed && no<=15){
      let ye=new Date(cur); ye.setFullYear(ye.getFullYear()+1); ye.setDate(ye.getDate()-1);
      if(ye>ed) ye=new Date(ed);
      out.push({ project_id:proj.id, year_no:no, year_label:no+'차년도',
        start_date:iso(cur), end_date:iso(ye),
        govt_budget:0, cash_budget:0, kind_budget:0, total_budget:0, carry_over:0 });
      let nx=new Date(ye); nx.setDate(nx.getDate()+1); cur=nx; no++;
    }
    return out;
  }

  async function autoGen(){
    const gen = genYears();
    if(!gen) return;
    if(rows && rows.length>0){
      if(!confirm(`이미 연차가 ${rows.length}개 있습니다.\n모두 삭제하고 협약기간 기준으로 다시 생성할까요?`)) return;
      await sb.from('project_years').delete().eq('project_id',proj.id);
    }
    const {error} = await sb.from('project_years').insert(gen);
    if(error){ showToast('생성 실패: '+error.message,'err'); return; }
    audit(user,'GEN_YEARS',proj.id, gen.length+'개 연차 생성');
    showToast(gen.length+'개 연차가 생성되었습니다'); load();
  }

  async function saveYear(payload){
    if(modal==='new'){
      const year_no = (rows?.length||0)+1;
      const {error} = await sb.from('project_years').insert({...payload, project_id:proj.id, year_no});
      if(error){ showToast('저장 실패: '+error.message,'err'); return; }
      showToast('연차가 추가되었습니다');
    }else{
      const {error} = await sb.from('project_years').update(payload).eq('id',modal.id);
      if(error){ showToast('저장 실패: '+error.message,'err'); return; }
      showToast('수정되었습니다');
    }
    setModal(null); load();
  }

  async function delYear(y){
    if(!confirm(`"${y.year_label}"을(를) 삭제하시겠습니까?`)) return;
    const {error} = await sb.from('project_years').delete().eq('id',y.id);
    if(error){ showToast('삭제 실패: '+error.message,'err'); return; }
    showToast('삭제되었습니다'); load();
  }

  const sum = useMemo(()=>{
    const list=rows||[];
    return {
      govt:list.reduce((s,y)=>s+n(y.govt_budget),0),
      cash:list.reduce((s,y)=>s+n(y.cash_budget),0),
      kind:list.reduce((s,y)=>s+n(y.kind_budget),0),
    };
  },[rows]);

  return (
    <div>
      {/* 안내 + 액션 */}
      <div className="card" style={{padding:'14px 18px',marginBottom:16,display:'flex',
        justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
        <div style={{fontSize:13,color:'var(--text-sub)'}}>
          <i className="ti ti-info-circle" style={{color:'var(--brand)',marginRight:6}}/>
          협약기간 <b>{proj.period_start||'—'} ~ {proj.period_end||'—'}</b> 기준으로 연차를 자동 생성할 수 있습니다.
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={autoGen}><i className="ti ti-wand"/> 연차 자동 생성</button>
          <button className="btn btn-brand btn-sm" onClick={()=>setModal('new')}><i className="ti ti-plus"/> 연차 추가</button>
        </div>
      </div>

      {/* 연차별 합계 */}
      {rows && rows.length>0 && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:16}}>
          <div className="card" style={{padding:'14px 16px'}}>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>정부출연금 합계</div>
            <div style={{fontSize:17,fontWeight:800}}>{fmt(sum.govt)}원</div></div>
          <div className="card" style={{padding:'14px 16px'}}>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>자부담 현금 합계</div>
            <div style={{fontSize:17,fontWeight:800}}>{fmt(sum.cash)}원</div></div>
          <div className="card" style={{padding:'14px 16px'}}>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>자부담 현물 합계</div>
            <div style={{fontSize:17,fontWeight:800}}>{fmt(sum.kind)}원</div></div>
        </div>
      )}

      {/* 연차 표 */}
      <div className="card" style={{overflow:'hidden'}}>
        {rows===null ? (
          <div style={{padding:40,display:'flex',justifyContent:'center'}}><div className="spinner"/></div>
        ) : rows.length===0 ? (
          <div style={{padding:'44px 24px',textAlign:'center'}}>
            <i className="ti ti-calendar-off" style={{fontSize:36,color:'#cbd5e1'}}/>
            <div style={{fontWeight:700,marginTop:12}}>등록된 연차가 없습니다</div>
            <div style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>"연차 자동 생성" 또는 "연차 추가"로 시작하세요.</div>
          </div>
        ) : (
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead><tr>
                <th>연차</th><th>기간</th>
                <th style={{textAlign:'right'}}>정부출연금</th>
                <th style={{textAlign:'right'}}>자부담현금</th>
                <th style={{textAlign:'right'}}>자부담현물</th>
                <th style={{textAlign:'right'}}>예산합계</th>
                <th style={{textAlign:'right'}}>이월금</th>
                <th style={{textAlign:'center'}}>관리</th>
              </tr></thead>
              <tbody>
                {rows.map(y=>(
                  <tr key={y.id}>
                    <td><span className="badge b-준비" style={{fontWeight:700}}>{y.year_label}</span></td>
                    <td style={{fontSize:12,color:'var(--text-sub)',whiteSpace:'nowrap'}}>{y.start_date||'—'} ~ {y.end_date||'—'}</td>
                    <td style={{textAlign:'right'}}>{fmt(y.govt_budget)}</td>
                    <td style={{textAlign:'right'}}>{fmt(y.cash_budget)}</td>
                    <td style={{textAlign:'right'}}>{fmt(y.kind_budget)}</td>
                    <td style={{textAlign:'right',fontWeight:700}}>{fmt(y.total_budget)}</td>
                    <td style={{textAlign:'right',color:'var(--text-sub)'}}>{fmt(y.carry_over)}</td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm" style={{marginRight:5}} onClick={()=>setModal(y)}><i className="ti ti-pencil"/></button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>delYear(y)} style={{color:'#ef4444'}}><i className="ti ti-trash"/></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <YearModal year={modal==='new'?null:modal}
          onClose={()=>setModal(null)} onSave={saveYear}/>
      )}
    </div>
  );
}

/* ================= 금액 입력칸 (콤마 자동 표시) ================= */
function MoneyInput({value,onChange,placeholder,style}){
  const comma = v => { const raw=String(v??'').replace(/[^0-9]/g,''); return raw?Number(raw).toLocaleString('ko-KR'):''; };
  return <input inputMode="numeric" style={style} value={comma(value)}
    onChange={e=>onChange(e.target.value.replace(/[^0-9]/g,''))} placeholder={placeholder}/>;
}

/* ================= 사업비 계산기 (등록·설정 탭 내용 2) — 원본 GAS 로직과 동일 ================= */
function BudgetCalculator({user,proj,onSaved,showToast}){
  // 콤마 유틸
  const toNum   = s => Number(String(s).replace(/,/g,''))||0;
  const toComma = v => { if(v===''||v==null) return ''; const num=Number(String(v).replace(/,/g,'')); if(isNaN(num)||num===0) return ''; return num.toLocaleString('ko-KR'); };

  const [govt,setGovt]       = useState('');
  const [cashPct,setCashPct] = useState('');
  const [kindPct,setKindPct] = useState('');
  const [cashAmt,setCashAmt] = useState('');
  const [kindAmt,setKindAmt] = useState('');
  const [saving,setSaving]   = useState(false);

  // 진입 시 과제의 기존 예산 불러오기 → 비율 역산 (총사업비 기준)
  useEffect(()=>{
    const g=Number(proj.govt_budget)||0, c=Number(proj.cash_budget)||0, k=Number(proj.kind_budget)||0;
    const total=g+c+k;
    setGovt(toComma(g)); setCashAmt(toComma(c)); setKindAmt(toComma(k));
    if(total>0){ setCashPct((c/total*100).toFixed(1)); setKindPct((k/total*100).toFixed(1)); }
    else { setCashPct(''); setKindPct(''); }
  },[proj.id]);

  // 비율 입력 → 금액 자동 (총사업비 = 정부지원금 / (1 - 자부담비율합))
  const calcFromPct = (field,val) => {
    const cp = field==='cash' ? (parseFloat(val)||0) : (parseFloat(cashPct)||0);
    const kp = field==='kind' ? (parseFloat(val)||0) : (parseFloat(kindPct)||0);
    if(field==='cash') setCashPct(val);
    if(field==='kind') setKindPct(val);
    const g = toNum(govt); if(!g) return;
    const instPct = (cp+kp)/100;
    if(instPct>=1){ setCashAmt(''); setKindAmt(''); return; }
    const total = g/(1-instPct);
    setCashAmt(toComma(Math.round(total*cp/100)));
    setKindAmt(toComma(Math.round(total*kp/100)));
  };

  // 금액 입력 → 비율 자동 (총사업비 대비)
  const calcFromAmt = (field,val) => {
    const formatted = val ? Number(val.replace(/[^0-9]/g,'')).toLocaleString('ko-KR') : '';
    if(field==='cash') setCashAmt(formatted);
    if(field==='kind') setKindAmt(formatted);
    const g = toNum(govt);
    const c = field==='cash' ? toNum(formatted) : toNum(cashAmt);
    const k = field==='kind' ? toNum(formatted) : toNum(kindAmt);
    const total = g+c+k;
    if(total>0){ setCashPct((c/total*100).toFixed(1)); setKindPct((k/total*100).toFixed(1)); }
  };

  // 정부지원금 변경 → 비율 유지하며 금액 재계산
  const handleGovtChange = (val) => {
    const formatted = val ? Number(val.replace(/[^0-9]/g,'')).toLocaleString('ko-KR') : '';
    setGovt(formatted);
    const g = toNum(formatted);
    const cp = parseFloat(cashPct)||0, kp = parseFloat(kindPct)||0;
    if(!g||!(cp+kp)) return;
    const instPct=(cp+kp)/100; if(instPct>=1) return;
    const total=g/(1-instPct);
    setCashAmt(toComma(Math.round(total*cp/100)));
    setKindAmt(toComma(Math.round(total*kp/100)));
  };

  // 결과
  const g=toNum(govt), c=toNum(cashAmt), k=toNum(kindAmt);
  const total=g+c+k;
  const govtPct = total>0 ? g/total*100 : 0;
  const cPct    = total>0 ? c/total*100 : 0;
  const kPct    = total>0 ? k/total*100 : 0;
  const instPct = cPct+kPct;
  const isOverInst = instPct>=100;
  const fmt2 = num => Math.round(num).toLocaleString('ko-KR');

  async function apply(){
    if(!g){ showToast('정부지원금을 입력하세요','err'); return; }
    if(isOverInst){ showToast('자부담 비율 합계가 100% 이상입니다','err'); return; }
    setSaving(true);
    const {error} = await sb.from('projects').update({
      govt_budget:g, cash_budget:c, kind_budget:k, total_budget:total,
      updated_at:new Date().toISOString() }).eq('id',proj.id);
    setSaving(false);
    if(error){ showToast('저장 실패: '+error.message,'err'); return; }
    audit(user,'BUDGET_CALC',proj.id,`총 ${fmt(total)} / 자부담 ${fmt(c+k)}`);
    showToast('사업비가 저장되었습니다'); onSaved();
  }

  const Result = ({label,value,pct,strong}) => (
    <div style={{padding:'12px 14px',background:strong?'rgba(249,115,22,.08)':'#f8fafc',
      borderRadius:8,border:'1px solid '+(strong?'rgba(249,115,22,.2)':'var(--border)')}}>
      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>{label}{pct!=null?` · ${pct.toFixed(1)}%`:''}</div>
      <div style={{fontSize:16,fontWeight:800,color:strong?'var(--brand)':'var(--text)'}}>{fmt2(value)}원</div>
    </div>
  );

  return (
    <div>
      <div className="card" style={{padding:22,marginBottom:16}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>사업비 계산기</div>
        <div style={{fontSize:12,color:'var(--text-sub)',marginBottom:18}}>
          자부담현금·현물 비율은 <b>총사업비 기준</b>입니다. 비율을 넣으면 금액이, 금액을 넣으면 비율이 자동 계산됩니다. (총사업비 = 정부지원금 ÷ (1 − 자부담비율합))
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>
          <div><label className="form-label">정부지원금</label>
            <input inputMode="numeric" value={govt} onChange={e=>handleGovtChange(e.target.value)} placeholder="0"/></div>
          <div><label className="form-label">자부담현금 비율 (%)</label>
            <input inputMode="numeric" value={cashPct} onChange={e=>calcFromPct('cash',e.target.value)} placeholder="예: 15"/></div>
          <div><label className="form-label">자부담현물 비율 (%)</label>
            <input inputMode="numeric" value={kindPct} onChange={e=>calcFromPct('kind',e.target.value)} placeholder="예: 10"/></div>
          <div><label className="form-label">자부담현금 금액</label>
            <input inputMode="numeric" value={cashAmt} onChange={e=>calcFromAmt('cash',e.target.value)} placeholder="0"/></div>
          <div><label className="form-label">자부담현물 금액</label>
            <input inputMode="numeric" value={kindAmt} onChange={e=>calcFromAmt('kind',e.target.value)} placeholder="0"/></div>
        </div>
      </div>

      <div className="card" style={{padding:22,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:14,color:'var(--text-sub)'}}>계산 결과</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:12}}>
          <Result label="정부지원금" value={g} pct={total>0?govtPct:null}/>
          <Result label="자부담현금" value={c} pct={total>0?cPct:null}/>
          <Result label="자부담현물" value={k} pct={total>0?kPct:null}/>
        </div>
        <Result label="총사업비" value={total} strong/>
        {isOverInst && (
          <div style={{marginTop:12,padding:'10px 14px',borderRadius:8,fontSize:13,
            background:'rgba(239,68,68,.1)',color:'#ef4444'}}>자부담 비율 합계가 100% 이상입니다. 비율을 확인하세요.</div>
        )}
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-brand" onClick={apply} disabled={saving}>{saving?'저장 중...':'이 과제에 적용'}</button>
        </div>
      </div>

      <div className="card" style={{padding:'14px 18px',fontSize:12,color:'var(--text-sub)'}}>
        <i className="ti ti-database" style={{marginRight:6,color:'var(--brand)'}}/>
        현재 저장된 예산 — 정부 <b>{fmt(proj.govt_budget)}</b> · 현금 <b>{fmt(proj.cash_budget)}</b> · 현물 <b>{fmt(proj.kind_budget)}</b> · 총 <b>{fmt(proj.total_budget)}</b>원
      </div>
    </div>
  );
}

/* ================= 세부 비목 모달 ================= */
const CAT_OPTIONS = ['인건비','장비비','임차료','일반수용비','일반용역비','여비','기타비용'];
function CategoryModal({cat,onClose,onSave}){
  const isNew = !cat;
  const [f,setF] = useState({
    category: cat?.category||'인건비', sub_category: cat?.sub_category||'',
    budget_govt: cat?.budget_govt||'', budget_cash: cat?.budget_cash||'', budget_kind: cat?.budget_kind||'',
    kind_type: cat?.kind_type||'', note: cat?.note||'',
  });
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const total = n(f.budget_govt)+n(f.budget_cash)+n(f.budget_kind);

  async function go(){
    if(!f.category){ setErr('비목을 선택하세요.'); return; }
    setBusy(true); setErr('');
    await onSave({
      category:f.category, sub_category:f.sub_category.trim()||null,
      budget_govt:n(f.budget_govt), budget_cash:n(f.budget_cash), budget_kind:n(f.budget_kind),
      budget_total:total, kind_type:f.kind_type||null, note:f.note.trim()||null,
    });
    setBusy(false);
  }

  return (
    <div className="modal-bg" onMouseDown={onClose}>
      <div className="card" style={{width:'100%',maxWidth:560,padding:24}}
        onMouseDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <div style={{fontSize:17,fontWeight:800}}>{isNew?'비목 추가':'비목 수정'}</div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'var(--text-muted)'}}>×</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13}}>
          <div><label className="form-label">비목 *</label>
            <select value={f.category} onChange={e=>set('category',e.target.value)}>
              {CAT_OPTIONS.map(c=><option key={c} value={c}>{c}</option>)}
            </select></div>
          <div><label className="form-label">세목</label>
            <input value={f.sub_category} onChange={e=>set('sub_category',e.target.value)} placeholder="예: 연구원인건비, 소모품비"/></div>
          <div><label className="form-label">정부출연금</label>
            <MoneyInput value={f.budget_govt} onChange={v=>set('budget_govt',v)} placeholder="0"/></div>
          <div><label className="form-label">자부담현금</label>
            <MoneyInput value={f.budget_cash} onChange={v=>set('budget_cash',v)} placeholder="0"/></div>
          <div><label className="form-label">자부담현물</label>
            <MoneyInput value={f.budget_kind} onChange={v=>set('budget_kind',v)} placeholder="0"/></div>
          <div><label className="form-label">합계 (자동)</label>
            <div style={{padding:'9px 12px',background:'rgba(249,115,22,.08)',borderRadius:8,
              border:'1px solid rgba(249,115,22,.2)',fontWeight:800,color:'var(--brand)'}}>{fmt(total)}원</div></div>
          <div><label className="form-label">현물 유형 (선택)</label>
            <select value={f.kind_type} onChange={e=>set('kind_type',e.target.value)}>
              <option value="">없음</option>
              <option value="장비비">장비비</option>
              <option value="임차료">임차료</option>
              <option value="인건비">인건비</option>
            </select></div>
          <div><label className="form-label">비고</label>
            <input value={f.note} onChange={e=>set('note',e.target.value)} placeholder="특이사항"/></div>
        </div>
        {err && <div style={{marginTop:14,padding:'10px 14px',borderRadius:8,fontSize:13,background:'rgba(239,68,68,.1)',color:'#ef4444'}}>{err}</div>}
        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:18}}>
          <button className="btn btn-ghost" onClick={onClose} disabled={busy}>취소</button>
          <button className="btn btn-brand" onClick={go} disabled={busy}>{busy?'저장 중...':'저장'}</button>
        </div>
      </div>
    </div>
  );
}

/* ================= 세부 비목 관리 (등록·설정 탭 내용 3) ================= */
function CategoryManager({user,proj,showToast}){
  const [rows,setRows] = useState(null);
  const [modal,setModal] = useState(null);

  async function load(){
    const {data} = await sb.from('categories').select('*').eq('project_id',proj.id).order('id');
    setRows(data||[]);
  }
  useEffect(()=>{ load(); },[proj.id]);

  const sum = useMemo(()=>{
    const list=rows||[];
    return { govt:list.reduce((s,c)=>s+n(c.budget_govt),0),
             cash:list.reduce((s,c)=>s+n(c.budget_cash),0),
             kind:list.reduce((s,c)=>s+n(c.budget_kind),0) };
  },[rows]);
  const sumTotal = sum.govt+sum.cash+sum.kind;

  async function saveCat(payload){
    if(modal==='new'){
      const {error} = await sb.from('categories').insert({...payload, project_id:proj.id});
      if(error){ showToast('저장 실패: '+error.message,'err'); return; }
      showToast('비목이 추가되었습니다');
    }else{
      const {error} = await sb.from('categories').update(payload).eq('id',modal.id);
      if(error){ showToast('저장 실패: '+error.message,'err'); return; }
      showToast('수정되었습니다');
    }
    setModal(null); load();
  }

  async function delCat(c){
    if(!confirm(`비목 "${c.category} / ${c.sub_category||'-'}"을(를) 삭제하시겠습니까?`)) return;
    const {error} = await sb.from('categories').delete().eq('id',c.id);
    if(error){ showToast('삭제 실패: '+error.message,'err'); return; }
    showToast('삭제되었습니다'); load();
  }

  const projTotal = n(proj.total_budget);
  const diff = projTotal - sumTotal; // 과제 총사업비 대비 비목합계 차이

  return (
    <div>
      <div className="card" style={{padding:'14px 18px',marginBottom:16,display:'flex',
        justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
        <div style={{fontSize:13,color:'var(--text-sub)'}}>
          <i className="ti ti-info-circle" style={{color:'var(--brand)',marginRight:6}}/>
          비목별 예산을 등록합니다. 합계가 과제 총사업비와 맞는지 아래에서 확인하세요.
        </div>
        <button className="btn btn-brand btn-sm" onClick={()=>setModal('new')}><i className="ti ti-plus"/> 비목 추가</button>
      </div>

      {/* 합계 카드 + 과제 예산 대비 */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}}>
        <div className="card" style={{padding:'14px 16px'}}>
          <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>정부출연금 합계</div>
          <div style={{fontSize:16,fontWeight:800}}>{fmt(sum.govt)}원</div></div>
        <div className="card" style={{padding:'14px 16px'}}>
          <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>자부담현금 합계</div>
          <div style={{fontSize:16,fontWeight:800}}>{fmt(sum.cash)}원</div></div>
        <div className="card" style={{padding:'14px 16px'}}>
          <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>자부담현물 합계</div>
          <div style={{fontSize:16,fontWeight:800}}>{fmt(sum.kind)}원</div></div>
        <div className="card" style={{padding:'14px 16px'}}>
          <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>비목 총합계</div>
          <div style={{fontSize:16,fontWeight:800,color:'var(--brand)'}}>{fmt(sumTotal)}원</div>
          {projTotal>0 && (
            <div style={{fontSize:11,marginTop:4,color:diff===0?'#10b981':(diff>0?'#f59e0b':'#ef4444')}}>
              {diff===0?'총사업비와 일치 ✓':(diff>0?`${fmt(diff)}원 남음`:`${fmt(-diff)}원 초과`)}
            </div>
          )}
        </div>
      </div>

      <div className="card" style={{overflow:'hidden'}}>
        {rows===null ? (
          <div style={{padding:40,display:'flex',justifyContent:'center'}}><div className="spinner"/></div>
        ) : rows.length===0 ? (
          <div style={{padding:'44px 24px',textAlign:'center'}}>
            <i className="ti ti-list-details" style={{fontSize:36,color:'#cbd5e1'}}/>
            <div style={{fontWeight:700,marginTop:12}}>등록된 비목이 없습니다</div>
            <div style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>"비목 추가"로 비목별 예산을 등록하세요.</div>
          </div>
        ) : (
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead><tr>
                <th>비목</th><th>세목</th>
                <th style={{textAlign:'right'}}>정부출연금</th>
                <th style={{textAlign:'right'}}>자부담현금</th>
                <th style={{textAlign:'right'}}>자부담현물</th>
                <th style={{textAlign:'right'}}>합계</th>
                <th style={{textAlign:'center'}}>현물유형</th>
                <th style={{textAlign:'center'}}>관리</th>
              </tr></thead>
              <tbody>
                {rows.map(c=>(
                  <tr key={c.id}>
                    <td style={{fontWeight:700}}>{c.category}</td>
                    <td style={{fontSize:12,color:'var(--text-sub)'}}>{c.sub_category||'—'}</td>
                    <td style={{textAlign:'right'}}>{fmt(c.budget_govt)}</td>
                    <td style={{textAlign:'right'}}>{fmt(c.budget_cash)}</td>
                    <td style={{textAlign:'right'}}>{fmt(c.budget_kind)}</td>
                    <td style={{textAlign:'right',fontWeight:700}}>{fmt(c.budget_total)}</td>
                    <td style={{textAlign:'center'}}>{c.kind_type?<span className="badge b-신청">{c.kind_type}</span>:<span style={{color:'#cbd5e1'}}>—</span>}</td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm" style={{marginRight:5}} onClick={()=>setModal(c)}><i className="ti ti-pencil"/></button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>delCat(c)} style={{color:'#ef4444'}}><i className="ti ti-trash"/></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && <CategoryModal cat={modal==='new'?null:modal} onClose={()=>setModal(null)} onSave={saveCat}/>}
    </div>
  );
}

/* ================= 과제 상세 페이지 ================= */
function ProjectDetail({user,project,onBack,showToast}){
  const [proj,setProj] = useState(project);
  const [ptab,setPtab] = useState('setup'); // prepare/setup/execute/settle
  const [setupTab,setSetupTab] = useState('calc'); // calc/years
  const [modal,setModal] = useState(false);

  async function reload(){
    const {data} = await sb.from('projects').select('*').eq('id',proj.id).single();
    if(data) setProj(data);
  }

  const tabs = [
    {id:'prepare', label:'준비',       icon:'ti-clipboard-list'},
    {id:'setup',   label:'등록·설정',  icon:'ti-adjustments'},
    {id:'execute', label:'수행·집행',  icon:'ti-receipt'},
    {id:'settle',  label:'정산·보고',  icon:'ti-report-analytics'},
  ];

  const Info = ({label,value}) => (
    <div>
      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:3}}>{label}</div>
      <div style={{fontSize:14,fontWeight:600}}>{value||'—'}</div>
    </div>
  );

  const placeholder = (title,desc) => (
    <div className="card" style={{padding:'44px 24px',textAlign:'center'}}>
      <i className="ti ti-tools" style={{fontSize:36,color:'#cbd5e1'}}/>
      <div style={{fontWeight:700,marginTop:12}}>{title}</div>
      <div style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>{desc}</div>
    </div>
  );

  return (
    <main style={{flex:1,padding:32,overflow:'auto'}}>
      <button className="btn btn-ghost btn-sm" onClick={onBack} style={{marginBottom:16}}>
        <i className="ti ti-arrow-left"/> 목록으로
      </button>

      {/* 과제 요약 헤더 */}
      <div className="card" style={{padding:24,marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-.02em'}}>{proj.name}</h1>
              <span className={"badge b-"+(proj.status||'준비')}>{proj.status||'준비'}</span>
            </div>
            {proj.program && <div style={{fontSize:13,color:'var(--text-sub)',marginTop:4}}>{proj.program}</div>}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setModal(true)}><i className="ti ti-pencil"/> 기본정보 수정</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:18,marginTop:20,
          paddingTop:18,borderTop:'1px solid var(--border)'}}>
          <Info label="주관기관" value={proj.agency}/>
          <Info label="협약기간" value={(proj.period_start||'—')+' ~ '+(proj.period_end||'—')}/>
          <Info label="총사업비" value={proj.total_budget?fmt(proj.total_budget)+'원':'—'}/>
          <Info label="담당자" value={proj.owner}/>
        </div>
      </div>

      {/* 4단계 탭 */}
      <div style={{borderBottom:'1px solid var(--border)',marginBottom:22,overflowX:'auto',whiteSpace:'nowrap'}}>
        {tabs.map(t=>(
          <span key={t.id} className={"ptab"+(ptab===t.id?' active':'')} onClick={()=>setPtab(t.id)}>
            <i className={"ti "+t.icon}/>{t.label}
          </span>
        ))}
      </div>

      {/* 탭 내용 (Phase 2-1은 뼈대만; 다음 단계에서 채움) */}
      {ptab==='prepare' && placeholder('Phase 1 · 준비','과제 준비 단계 정보가 여기 들어갑니다.')}
      {ptab==='setup' && (
        <div>
          <div style={{display:'flex',gap:8,marginBottom:18}}>
            <button className={"btn btn-sm "+(setupTab==='calc'?'btn-brand':'btn-ghost')} onClick={()=>setSetupTab('calc')}>
              <i className="ti ti-calculator"/> 사업비 계산기</button>
            <button className={"btn btn-sm "+(setupTab==='years'?'btn-brand':'btn-ghost')} onClick={()=>setSetupTab('years')}>
              <i className="ti ti-calendar-stats"/> 연차 관리</button>
            <button className={"btn btn-sm "+(setupTab==='cats'?'btn-brand':'btn-ghost')} onClick={()=>setSetupTab('cats')}>
              <i className="ti ti-list-details"/> 세부 비목</button>
          </div>
          {setupTab==='calc'  && <BudgetCalculator user={user} proj={proj} onSaved={reload} showToast={showToast}/>}
          {setupTab==='years' && <YearManager user={user} proj={proj} showToast={showToast}/>}
          {setupTab==='cats'  && <CategoryManager user={user} proj={proj} showToast={showToast}/>}
        </div>
      )}
      {ptab==='execute' && placeholder('Phase 3 · 수행·집행','집행 입력 · 인건비 · 현물이 추가됩니다.')}
      {ptab==='settle'  && placeholder('Phase 4 · 정산·보고','연차별 집행률 · 잔액 · 증빙 점검 · 엑셀 내보내기가 추가됩니다.')}

      {modal && (
        <ProjectModal user={user} editItem={proj}
          onClose={()=>setModal(false)}
          onSaved={()=>{ setModal(false); reload(); }} showToast={showToast}/>
      )}
    </main>
  );
}

/* ================= 껍데기 ================= */
function Shell({user,onLogout}){
  const [tab,setTab] = useState('dashboard');
  const [openProj,setOpenProj] = useState(null); // 열려있는 과제 (상세)
  const [toastNode,showToast] = useToast();

  return (
    <div style={{display:'flex',minHeight:'100vh'}}>
      <Sidebar user={user} onLogout={onLogout}
        tab={openProj?'':tab}
        setTab={t=>{ setOpenProj(null); setTab(t); }}/>
      {openProj
        ? <ProjectDetail user={user} project={openProj} onBack={()=>setOpenProj(null)} showToast={showToast}/>
        : (tab==='dashboard' && <Dashboard user={user} showToast={showToast} onOpen={setOpenProj}/>)}
      {toastNode}
    </div>
  );
}

/* ================= 최상위 ================= */
function App(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setUser(data.session?.user||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setUser(s?.user||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(user===undefined) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;
  if(!user) return <Login/>;
  return <Shell user={user} onLogout={async()=>{await sb.auth.signOut();}}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
