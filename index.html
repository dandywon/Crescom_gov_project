<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRESCOM 정부과제 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e293b; --navy-2:#0f172a;
    --brand:#f97316; --brand-dark:#ea580c;
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0;
    --text:#111827; --text-sub:#475569; --text-muted:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;
    background:#fff;color:var(--text);outline:none;font-family:inherit;transition:border .15s}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
  .btn{border:none;cursor:pointer;border-radius:8px;font-weight:600;font-family:inherit;
    font-size:14px;padding:10px 18px;transition:all .15s}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-brand:hover{background:var(--brand-dark)}
  .btn-brand:disabled{opacity:.6;cursor:default}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text-sub)}
  .btn-ghost:hover{background:var(--bg)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .sidebar-item{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;
    gap:10px;font-size:13px;font-weight:500;color:#94a3b8;transition:all .15s}
  .sidebar-item:hover{background:rgba(255,255,255,.08);color:#e2e8f0}
  .sidebar-item.active{background:rgba(249,115,22,.15);color:var(--brand)}
  .sidebar-item i{font-size:17px}
  .grp-label{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;
    letter-spacing:.08em;padding:14px 12px 6px}
  .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--brand);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

/* ================= Supabase 연결 =================
   ▼▼▼ 아래 두 줄을 본인 Supabase 정보로 교체하세요 ▼▼▼
   (Supabase → Settings → API 에서 확인)
=================================================== */
const SUPABASE_URL = 'https://ykqqlayayoqjgrbmvwpy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F5DkAu39-jqdAOkmxy3HGg_CvV6_j71';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= 유틸 ================= */
const fmt = n => (Number(n)||0).toLocaleString('ko-KR');

/* ================= 로그인 화면 ================= */
function Login(){
  const [email,setEmail] = useState('');
  const [pw,setPw]       = useState('');
  const [busy,setBusy]   = useState(false);
  const [err,setErr]     = useState('');

  async function go(){
    if(!email.trim()||!pw){ setErr('이메일과 비밀번호를 입력하세요.'); return; }
    setBusy(true); setErr('');
    const {error} = await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);
    if(error) setErr('로그인 실패: 이메일 또는 비밀번호를 확인하세요.');
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      background:'var(--navy)'}}>
      <div style={{width:360,padding:'36px 32px',background:'#fff',borderRadius:14,
        boxShadow:'0 10px 40px rgba(0,0,0,.3)'}}>
        <div style={{fontSize:22,fontWeight:800,color:'var(--brand)',letterSpacing:'-.02em'}}>CRESCOM</div>
        <div style={{fontSize:13,color:'var(--text-muted)',marginTop:2,marginBottom:24}}>정부과제 관리 시스템</div>

        <label style={{fontSize:12,fontWeight:600,color:'var(--text-sub)'}}>이메일</label>
        <input style={{marginTop:5,marginBottom:14}} value={email}
          onChange={e=>setEmail(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&go()} placeholder="you@crescom.co.kr"/>

        <label style={{fontSize:12,fontWeight:600,color:'var(--text-sub)'}}>비밀번호</label>
        <input style={{marginTop:5,marginBottom:20}} type="password" value={pw}
          onChange={e=>setPw(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&go()} placeholder="••••••••"/>

        <button className="btn btn-brand" style={{width:'100%'}} onClick={go} disabled={busy}>
          {busy?'로그인 중...':'로그인'}
        </button>
        {err && <div style={{marginTop:14,fontSize:13,color:'#ef4444'}}>{err}</div>}
      </div>
    </div>
  );
}

/* ================= 사이드바 ================= */
function Sidebar({user,onLogout}){
  return (
    <aside style={{width:220,background:'var(--navy)',display:'flex',flexDirection:'column',
      flexShrink:0,padding:'18px 12px'}}>
      <div style={{padding:'6px 8px 16px',borderBottom:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{fontSize:16,fontWeight:800,color:'var(--brand)',letterSpacing:'-.02em'}}>CRESCOM</div>
        <div style={{fontSize:10,color:'#64748b',marginTop:1}}>정부과제 관리</div>
      </div>

      <div className="grp-label">메인</div>
      <div className="sidebar-item active"><i className="ti ti-layout-dashboard"/> 전체 현황판</div>

      <div className="grp-label">공통 관리</div>
      <div className="sidebar-item" style={{opacity:.5,cursor:'default'}}>
        <i className="ti ti-users"/> 직원 관리 <span style={{fontSize:9,marginLeft:'auto'}}>준비중</span>
      </div>
      <div className="sidebar-item" style={{opacity:.5,cursor:'default'}}>
        <i className="ti ti-layout-grid"/> 참여율 현황 <span style={{fontSize:9,marginLeft:'auto'}}>준비중</span>
      </div>

      <div style={{marginTop:'auto',padding:'14px 8px 0',borderTop:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{fontSize:11,color:'#cbd5e1',marginBottom:8,wordBreak:'break-all'}}>{user.email}</div>
        <button className="btn btn-ghost" style={{width:'100%',fontSize:12,padding:'7px'}}
          onClick={onLogout}>로그아웃</button>
      </div>
    </aside>
  );
}

/* ================= 대시보드 (Phase 0: 연결 확인용) ================= */
function Dashboard(){
  const [state,setState] = useState({loading:true,ok:false,count:0,error:''});

  useEffect(()=>{
    (async()=>{
      // Supabase 연결 + 테이블 접근 확인 (과제 개수 조회)
      const {count,error} = await sb.from('projects').select('*',{count:'exact',head:true});
      if(error) setState({loading:false,ok:false,count:0,error:error.message});
      else      setState({loading:false,ok:true,count:count||0,error:''});
    })();
  },[]);

  return (
    <main style={{flex:1,padding:32,overflow:'auto'}}>
      <h1 style={{fontSize:22,fontWeight:800,letterSpacing:'-.02em'}}>전체 현황판</h1>
      <div style={{fontSize:13,color:'var(--text-sub)',marginTop:4,marginBottom:24}}>
        {new Date().getFullYear()}년 정부과제 관리
      </div>

      {/* 연결 상태 카드 */}
      <div className="card" style={{padding:20,marginBottom:20}}>
        {state.loading ? (
          <div style={{display:'flex',alignItems:'center',gap:12,color:'var(--text-sub)'}}>
            <div className="spinner"/> 데이터베이스 연결 확인 중...
          </div>
        ) : state.ok ? (
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <i className="ti ti-circle-check" style={{fontSize:26,color:'#10b981'}}/>
            <div>
              <div style={{fontWeight:700}}>Supabase 연결 성공</div>
              <div style={{fontSize:13,color:'var(--text-sub)',marginTop:2}}>
                등록된 과제: <b>{fmt(state.count)}건</b>
              </div>
            </div>
          </div>
        ) : (
          <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
            <i className="ti ti-alert-circle" style={{fontSize:26,color:'#ef4444'}}/>
            <div>
              <div style={{fontWeight:700,color:'#ef4444'}}>연결 오류</div>
              <div style={{fontSize:12,color:'var(--text-sub)',marginTop:4}}>{state.error}</div>
              <div style={{fontSize:12,color:'var(--text-muted)',marginTop:6}}>
                → SQL 실행 여부, URL/KEY 입력, RLS 정책을 확인하세요.
              </div>
            </div>
          </div>
        )}
      </div>

      {/* 빈 상태 안내 */}
      <div className="card" style={{padding:'48px 24px',textAlign:'center'}}>
        <i className="ti ti-folder-open" style={{fontSize:40,color:'#cbd5e1'}}/>
        <div style={{fontWeight:700,marginTop:12}}>아직 등록된 과제가 없습니다</div>
        <div style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>
          다음 단계(Phase 1)에서 과제 등록 기능을 추가합니다.
        </div>
      </div>
    </main>
  );
}

/* ================= 앱 껍데기 ================= */
function Shell({user,onLogout}){
  return (
    <div style={{display:'flex',minHeight:'100vh'}}>
      <Sidebar user={user} onLogout={onLogout}/>
      <Dashboard/>
    </div>
  );
}

/* ================= 최상위 (로그인 게이트) ================= */
function App(){
  const [user,setUser] = useState(undefined); // undefined=확인중, null=로그아웃, 객체=로그인

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setUser(data.session?.user||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e,s)=>setUser(s?.user||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  if(user===undefined) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div className="spinner"/>
    </div>
  );
  if(!user) return <Login/>;
  return <Shell user={user} onLogout={async()=>{await sb.auth.signOut();}}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
